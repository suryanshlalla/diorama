<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diorama — feel prototype</title>

<!--
  FEEL PROTOTYPE — pan / zoom over a layered diorama.

  Single file, no build step, no network. The only external resources are the
  PNGs under design-lab/assets, by relative path — the cut-outs as delivered,
  plus assets/derived/, which design-lab/tools/prepare-assets.py writes by
  turning each object's baked-on pale contact shadow into honest alpha. Re-run
  that script whenever an asset is regenerated.

  §-references in the comments point at design-lab/research/diorama-motion.md
  for the camera, and at design-lab/research/natural-motion.md for the wind and
  the door swing. Every placement number in the scene layer was measured off
  the artwork; the comment beside it says how.

  The script is in two halves and they do not know about each other:
    §1–§4  camera + physics. Pure maths and one DOM-free state machine.
           This is the part that becomes lib/diorama/* in the real build.
    §5–§11 scene composition: this file's artwork, DOM, input plumbing,
           door transition, HUD.
  Both are reachable from window.Diorama, which is also what the
  verification harness drives.

  Entry points:
    prototype-feel.html          starts on the door scene
    prototype-feel.html#room     skips straight into the room
-->

<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #efece6;
    color: #14161a;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
  }

  #app { position: fixed; inset: 0; overflow: hidden; }

  [hidden] { display: none !important; }

  /* ─────────────────────────────────────────────────────────────────────
     VIEWPORT + STAGE
     §2.7 — we own every gesture on this element only, never on the page.
     ───────────────────────────────────────────────────────────────────── */
  .viewport {
    position: absolute;
    inset: 0;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
  }
  .viewport[data-dragging="1"] { cursor: grabbing; }
  .viewport:focus { outline: none; }
  .viewport:focus-visible { box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 6px #14161a; }

  /* §2.1 — transform-origin MUST be 0 0 or the anchoring algebra is only
     approximate. The box is the world box: 1306 x 1205, the base plate's
     natural size, which is WORLD in the script. */
  .stage {
    position: absolute;
    left: 0; top: 0;
    width: 1306px;
    height: 1205px;
    transform-origin: 0 0;
    /* NO will-change here. §3.3 — it is toggled from script, never declared. */
  }

  .paint { position: absolute; inset: 0; }

  /* One depth group = one constant 2D pan multiplier. §4.1 */
  .depth { position: absolute; inset: 0; transform-origin: 0 0; pointer-events: none; }
  .prop--spinnable { pointer-events: auto; }

  /* NO mix-blend-mode anywhere in this file. Every object in design-lab/assets
     is a real RGBA cut-out, and design-lab/tools/prepare-assets.py has already
     turned each one's baked-on pale contact shadow into either honest alpha or
     nothing at all. multiply was the workaround for opaque-RGB-on-white art;
     it is what made the desk look transparent, because it also multiplied the
     wood by whatever was behind it. */

  /* A static clipped aperture. The clip never moves; its children parallax and
     sway inside it. The room plate's glass is opaque paint, so the tree has to
     be drawn OVER the plate and cut back to the glass — which is what makes the
     clip the load-bearing part: it is the only thing standing between the tree
     canvas and the wall. Its polygons are measured from the plate's own pixels,
     see WINDOWS. */
  .slot { position: absolute; inset: 0; }

  .art { position: absolute; display: block; height: auto; -webkit-user-drag: none; }

  /* ── the tree, in pieces ──────────────────────────────────────────────
     One flat raster can only move as one thing, which is exactly what the
     owner rejected. The tree is now COMPOSED: far blossom haze, then the
     trunk, then five separate blossom branches, each a real cut-out hinged
     at the measured point where its bough runs off its own frame. Each layer
     carries its own transform-origin inline (measured from its alpha, see
     TREE_LAYERS), its own amplitude and its own phase lag, so the motion
     travels through the canopy instead of swinging in sync.
     No will-change: the running transform is already the compositing reason,
     and pinning it would fight the zoom's raster scale (diorama-motion §3.3). */
  .tree-layer { position: absolute; display: block; height: auto; -webkit-user-drag: none; }

  /* ── a BENDING bough (research/branch-bend.md §3.1, §6.2) ─────────────
     A rigid rotation swings a whole bough like a stick — the owner's exact
     objection. A real bough is a cantilever: displacement grows toward the
     tip as roughly s², sub-branches lag the base, blossom shimmers on top.
     Each bough is therefore a CHAIN of N nested segments. Every .seg is an
     unclipped wrapper rotated a little about the point where the bough's
     centreline crosses its seam; inside it, one overflow-hidden .strip shows
     that segment's band of the SAME image (one decode), and the next .seg
     rides inside it, so rotations accumulate down the chain and the composite
     curves. Chain, not fan: a fan shears neighbouring strips against each
     other by up to 3.7 px at the tip; a chain has zero shear, only a wedge
     the 8 px overlap hides. */
  .bough       { position: absolute; }
  .seg         { position: absolute; inset: 0; }
  .strip       { position: absolute; overflow: hidden; }
  .strip > img { position: absolute; left: 0; top: 0; display: block; height: auto; -webkit-user-drag: none; }

  /* The plate's own glass is a warm cream. A scrim over the whole aperture
     puts sky, haze and branches behind the same pane instead of leaving the
     composition looking pasted into a hole. */
  .glaze { position: absolute; inset: 0; pointer-events: none;
           background: linear-gradient(160deg, rgb(255 246 226 / .30), rgb(255 232 205 / .16) 55%, rgb(246 238 255 / .22)); }

  /* ── desktop objects ──────────────────────────────────────────────────
     The contact shadow is drawn here rather than left baked into the art, so
     that a hover can lift the object and grow its shadow — the cheapest signal
     that a thing is a thing and not a sticker. ::before is the shadow, sized
     and placed from the object's own footprint by buildProps(). */
  .prop { position: absolute; }
  /* height:auto is load-bearing: the width/height ATTRIBUTES on the <img> are
     presentational hints, so without it the object is stretched to its natural
     pixel height inside a percentage-width box. */
  .prop__img { position: absolute; left: 0; top: 0; width: 100%; height: auto;
               -webkit-user-drag: none;
               transition: transform 160ms cubic-bezier(.22,.61,.36,1); }
  .prop::before {
    content: "";
    position: absolute;
    left: 50%;
    top: calc(100% - var(--sh-y, 0px));         /* up from the object's foot */
    width: var(--sh-w, 0);
    height: var(--sh-h, 0);
    border-radius: 50%;
    background: rgb(52 40 22 / .38);
    filter: blur(var(--sh-blur, 3px));
    /* ONLY opacity transitions here, deliberately. This element carries a
       blur(), and scaling a blurred element forces the browser to re-run the
       blur every frame of the transition — ten props each re-blurring on
       hover is what made pointing at the desk stutter. Opacity on an already
       rasterised layer is a compositor-only change and costs nothing. */
    transition: opacity 160ms linear;
    transform: translate(-50%, -50%);
  }
  .prop--noshadow::before { display: none; }
  .prop:hover::before { opacity: .78; }
  /* The lift stays: translate is compositor-only and the img carries no
     filter, so it is cheap. It is also the whole affordance. */
  .prop:hover .prop__img { transform: translateY(-4%); }
  /* Fixed props (the chair) keep their painted floor shadow: no lift, or the
     baked shadow would slide up the carpet with the image. Hover affordance
     comes from the focus ring and cursor instead. */
  .prop--fixed:hover .prop__img { transform: none; }

  /* ── THE CHAIR SWIVEL ─────────────────────────────────────────────────
     A real swivel from one flat image. The turnaround sheet exists but its
     three rows sit at different camera heights (y-extents 72-383, 59-351,
     17-327), so playing those frames in sequence makes the chair hop; that
     needs a re-render at one height before it is usable.

     scaleX does the work instead, and it is not a cheat — it is exactly what
     an orthographic camera sees as a body turns about its vertical axis:
     full width face-on, zero edge-on, negative (mirrored) showing the back.
     Two full turns, decelerating, with a small vertical squash at the fastest
     part so it has weight rather than looking like a flipping card. The chair
     keeps its own painted floor shadow, so the transform origin sits at the
     castors and the shadow turns with it. */
  .prop--spin-unused .prop__img {
    animation: chairSwivel 2600ms cubic-bezier(.18,.55,.28,1) both;  /* owner 2026-09-06: 1500ms read as a spin-top */
    transform-origin: 50% 92%;              /* the castor hub, not the image centre */
  }
  @keyframes chairSwivel {
    0%   { transform: scaleX(1)     scaleY(1); }
    12%  { transform: scaleX(.30)   scaleY(1.012); }
    25%  { transform: scaleX(-.85)  scaleY(.994); }
    37%  { transform: scaleX(-.35)  scaleY(1.010); }
    50%  { transform: scaleX(.92)   scaleY(.996); }
    64%  { transform: scaleX(.34)   scaleY(1.006); }
    78%  { transform: scaleX(-.80)  scaleY(.998); }
    90%  { transform: scaleX(-.28)  scaleY(1.002); }
    100% { transform: scaleX(1)     scaleY(1); }
  }
  /* Keyboard users get the same affordance the cursor gets. */
  .jelly-canvas { position: absolute; touch-action: none; }
  /* the live IST clock's hands: bottom-anchored slivers over the handless
     face (centre 36.4%/32.3% of the art, radius ~24% of its width) */
  .clock-hand {
    position: absolute;
    left: 20.9%;                    /* painted clock's face on the desk plate */
    translate: -50% 0;
    background: #4a3b2a;
    transform-origin: 50% 100%;
    border-radius: 45%;
    pointer-events: none;
  }
  .clock-hand--h { width: 0.42%; top: 5.17%; height: 1.03%; }
  .clock-hand--m { width: 0.32%; top: 4.7%; height: 1.51%; }
  .clock-cap {
    left: 20.9%; top: 6.21%;
    width: 0.7%; aspect-ratio: 1;
    translate: -50% -50%;
    border-radius: 50%;
    background: #6a5230;
  }
  .lamp-zone {
    position: absolute;
    pointer-events: auto;               /* the .depth wrapper is pointer-transparent */
    left: 24.5%; top: 1.19%;
    width: 10%; height: 11.94%;
    background: transparent;
    border: 0; padding: 0;
    border-radius: 50%;
    cursor: pointer;
  }
  .lamp-zone:focus-visible { outline: none; box-shadow: 0 0 0 2px #fff, 0 0 0 5px #14161a; }
  /* the pull chain IS the painted chain: its own pixels sliced from the
     plate (asset 420,80-452,142), rendered exactly over itself — invisible
     at rest, the door-knob trick — and stretched on the pull. The earlier
     decorative bar drew a SECOND string beside the painted one. */
  .lamp-string {
    position: absolute;
    left: 30.24%; top: 6.63%;
    width: 2.30%; height: auto;
    transform-origin: 50% 4%;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .lamp-string--pull { animation: lampPull 420ms cubic-bezier(.3,.9,.4,1); }
  @keyframes lampPull {
    0%   { transform: scaleY(1); }
    40%  { transform: scaleY(1.45); }
    70%  { transform: scaleY(0.92); }
    100% { transform: scaleY(1); }
  }
  .chair-spin {
    position: absolute; bottom: 0;
    background-image: url('assets/derived/chair-spin.png');
    background-repeat: no-repeat;
    pointer-events: none;
  }
  /* ── NIGHT ────────────────────────────────────────────────────────────
     One class on the stage. Plates crossfade (two imgs, opacity), the panes
     darken through their existing glaze, one indigo veil dims the rest, the
     lamp pools warm light, and fireflies drift outside the glass. Every
     moving part is opacity or transform — nothing rasterises per frame. */
  .art--night { opacity: 0; transition: opacity 1100ms ease; }
  .night .art--night { opacity: 1; }
  .night-veil {
    position: absolute; inset: -2%;
    background: linear-gradient(200deg, rgb(24 28 66 / .50) 0%, rgb(30 26 58 / .38) 55%, rgb(16 20 48 / .52) 100%);
    opacity: 0; transition: opacity 1100ms ease;
    pointer-events: none;
  }
  .night .night-veil { opacity: 0.62; }
  .night .glaze { background: rgb(16 18 48 / .55); transition: background 1100ms ease; }
  .glaze { transition: background 1100ms ease; }
  .lamp-glow {
    position: absolute;
    width: 340%; aspect-ratio: 1;
    left: 50%; top: 12%;
    translate: -50% -50%;
    background: radial-gradient(circle, rgb(255 214 140 / .7) 0%, rgb(255 196 110 / .36) 30%, rgb(255 180 90 / 0) 65%);
    opacity: 0; transition: opacity 1100ms ease;
    pointer-events: none;
  }
  /* the pool: warm light ON THE WOOD around the lamp's base, flattened to
     the desk's perspective — the old giant radial washed the window out and
     drowned the fireflies (owner's screenshot) */
  .leg-shadow {
    position: absolute;
    width: 8.5%; height: 2%;
    translate: -50% -30%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgb(30 24 16 / .38) 0%, rgb(30 24 16 / .16) 55%, rgb(30 24 16 / 0) 75%);
    pointer-events: none;
  }
  .mug-steam {
    position: absolute;
    top: 34.6%;                      /* just above the painted mug's rim */
    width: 1.6%; height: 4%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgb(255 255 250 / .40) 0%, rgb(255 255 250 / 0) 65%);
    pointer-events: none;
    animation: steamRise 3.8s ease-in-out infinite;
    opacity: 0;
  }
  @keyframes steamRise {
    0%   { transform: translateY(0) scale(0.7); opacity: 0; }
    25%  { opacity: .55; }
    70%  { opacity: .25; }
    100% { transform: translateY(-260%) scale(1.25) translateX(30%); opacity: 0; }
  }
  .lamp-pool {
    position: absolute;
    left: 29.5%; top: 13.5%;
    width: 30%; height: 12.7%;
    translate: -50% -50%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgb(255 208 130 / .5) 0%, rgb(255 190 110 / .22) 45%, rgb(255 180 90 / 0) 72%);
    opacity: 0; transition: opacity 1100ms ease;
    pointer-events: none;
  }
  .night .lamp-pool { opacity: 1; }
  .night .lamp-glow { opacity: 1; }
  .firefly {
    position: absolute;
    width: 13px; height: 13px; border-radius: 50%;
    box-shadow: 0 0 10px 2px rgb(255 232 150 / .55);
    background: radial-gradient(circle, rgb(255 240 170 / .95) 0%, rgb(255 220 120 / .35) 45%, rgb(255 220 120 / 0) 70%);
    opacity: 0; transition: opacity 1500ms ease;
    pointer-events: none;
    animation: fireflyDrift var(--ff-dur, 11s) ease-in-out infinite alternate,
               fireflyPulse 3.1s ease-in-out infinite;
    animation-play-state: paused, paused;
  }
  .night .firefly { opacity: 1; animation-play-state: running, running; }
  @keyframes fireflyDrift {
    0%   { transform: translate(0, 0); }
    30%  { transform: translate(var(--ff-x1, 26px), var(--ff-y1, -34px)); }
    65%  { transform: translate(var(--ff-x2, -18px), var(--ff-y2, -12px)); }
    100% { transform: translate(var(--ff-x3, 12px), var(--ff-y3, -46px)); }
  }
  @keyframes fireflyPulse {
    0%, 100% { filter: none; opacity: .55; }
    50%      { opacity: 1; }
  }
  .prop--spinnable { cursor: pointer; }
  .prop--spinnable:focus-visible { outline: none; }
  .prop--spinnable:focus-visible .prop__img {
    filter: drop-shadow(0 0 0 #fff) drop-shadow(0 0 3px #14161a);
  }

  /* ─────────────────────────────────────────────────────────────────────
     HOTSPOTS — siblings of the painted stack, never children of it.
     §6.5(a): role="img" makes every descendant presentational.
     ───────────────────────────────────────────────────────────────────── */
  /* THE OVERLAY THAT ATE EVERY CLICK (found 2026-09-06): this list spans the
     whole stage ABOVE the props and hit-tested solid — elementFromPoint over
     the chair returned .hotspots, so no prop ever received a real click (the
     owner's dead chair/jelly; synthetic-event tests bypassed hit-testing and
     hid it). The list must be transparent to the pointer; only its buttons
     are controls. Same for the .depth wrappers below. */
  .hotspots { position: absolute; inset: 0; margin: 0; padding: 0; list-style: none; pointer-events: none; }
  .hotspots .hotspot { pointer-events: auto; }
  .hotspot {
    position: absolute;
    /* §6.5(c) — never smaller than 24 rendered CSS px. --k-settled is written
       once when motion settles, never inside a gesture. */
    min-width: calc(24px / var(--k-settled, 1));
    min-height: calc(24px / var(--k-settled, 1));
    translate: -50% -50%;
    padding: 0;
    border: 0;
    border-radius: 50%;
    /* A RING, not a blob (owner, 2026-09-04: the wide soft donut read as an
       orange smudge). A thin bright band hugging the knob with a fast falloff
       reads as light catching a rim; the centre stays transparent so the
       painted knob does the acting. */
    background: radial-gradient(circle,
      rgb(255 248 228 / 0) 0%, rgb(255 248 228 / 0) 31%,
      rgb(255 250 234 / .5) 36%, rgb(255 226 150 / .22) 43%,
      rgb(255 214 130 / .06) 50%, rgb(255 205 100 / 0) 60%);
    cursor: pointer;
    animation: knobPulse 3.8s ease-in-out infinite;
    transition: opacity 300ms ease-out;
  }
  .hotspot:hover, .door-knob:hover { animation-play-state: paused; opacity: 1; }
  .hotspot:focus-visible { outline: none; box-shadow: 0 0 0 2px #fff, 0 0 0 5px #14161a; }

  /* Breathing, not blinking: small amplitude, slow period, and the scale
     stays near 1 so the halo never lurches. */
  @keyframes knobPulse {
    0%, 100% { opacity: .55; scale: .97; }
    50%      { opacity: .95; scale: 1.05; }
  }

  /* ─────────────────────────────────────────────────────────────────────
     DOOR SCENE
     Paint order: full plate (contains the closed door) -> the warm opening
     painted over the closed leaf -> a clipped copy of the leaf that swings
     away and reveals it.
     ───────────────────────────────────────────────────────────────────── */
  .door-scene { position: absolute; inset: 0; display: grid; place-items: center; }
  .door-frame {
    position: relative;
    width: min(88vw, calc(88vh * 1354 / 1161));
    aspect-ratio: 1354 / 1161;
    transform-origin: 50% 52%;
  }
  /* The door-frame box is the ENTRY plate's 1354 x 1161, because every door
     measurement in this file was taken in that plate's pixel coordinates. The
     leaf-less plate is 1353 x 1163 and registers onto it at (-1, -1) — found
     by minimising squared error over a +-6 px search on a ceiling band with no
     door in it — so it is placed by that offset rather than stretched to fit. */
  .door-frame > img.plate {
    position: absolute;
    left: -0.0739%;                             /* -1 / 1354 */
    top: -0.0861%;                              /* -1 / 1161 */
    width: 99.9261%;                            /* 1353 / 1354 */
    height: auto;
  }
  /* The entry window: same lavender sky backstop and the same tree layers as
     the room, clipped to the aperture measured on the entry plate. Sits under
     the door-opening in paint order (the leaf swings in front of the wall, and
     the wall is in front of the glass). */
  .entry-window {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #d6c2e6 0%, #debad0 52%, #eecad7 100%);
    /* aperture on the 1354 x 1161 entry frame: TL(924,255) TR(1129,185)
       BR(1137,929) BL(927,870), flood-filled from a seed in the glass */
    clip-path: polygon(68.24% 21.96%, 83.38% 15.94%, 83.97% 80.02%, 68.46% 74.94%);
  }
  .entry-window .tree-layer { position: absolute; }
  /* The head and the threshold, and NOT the jambs. The clip is on the WRAPPER,
     never on the leaf: it must apply AFTER the leaf's transform, and clip-path
     on a transformed element itself is applied in that element's own space.

     VERIFIED, because it decides the whole technique: a clip-path on this
     ancestor does NOT flatten the leaf's own perspective. Rendered both cases
     side by side in headless Chrome — a leaf at perspective(600px)
     rotateY(-45deg) inside a clip-path parent and inside a plain parent give
     byte-identical geometry (74.34 x 160 both). Flattening applies to a
     CHILD's 3D context; here perspective() lives inside the leaf's own
     transform, so it is self-contained and safe.

     THE BUG THIS PARAGRAPH ONCE WAS: this comment was previously closed one
     paragraph early, leaving the text below as RAW TEXT in the stylesheet — a
     parse error that silently dropped the ENTIRE .door-opening rule. No clip
     existed at all: the leaf passed through the plaster on every swing, the
     owner reported "it overlaps with the frame" three times, and every
     verification still was judged for pose rather than occlusion. Found
     2026-09-06 by diffing a mid-swing frame against the closed frame and
     asking which pixels changed OUTSIDE the aperture.

     THE FREE-SIDE JAMB IS LOAD-BEARING. The correct inward swing
     carries the leaf's free stile up to 17.38 px PAST the jamb (plate x 586.3
     -> 568.92 at 21.17 deg, back by 43.69), and that overhang is physically
     behind the wall. Without this clip the leaf visibly passes THROUGH the
     plaster for the first 44 degrees, which is a worse tell than the squash.
     43.264% = 585.8/1354; the painted leaf's opaque edge renders at 587.96, so
     2.16 px of clearance and nothing is shaved at rest. The head and threshold
     percentages are the EXISTING lines re-evaluated at the new left edge —
     recomputing them is not optional, since keeping the old y values while
     moving x re-slopes both edges by ~10 px. */
  .door-opening {
    position: absolute; inset: 0;
    clip-path: polygon(43.264% 21.048%, 61.299% 23.489%,
                       61.299% 77.286%, 43.264% 79.281%);
  }

  /* THE LEAF. A real cut-out now, so there is no clip-path, no filter and no
     opacity on it — natural-motion.md §3.5 and diorama-motion.md §4.1 both
     note that any of those silently flattens a 3D context, and the closed pose
     below IS a projective transform. The wrapper's clip is safe because the
     leaf is a leaf: it has no 3D descendants for the flattening to affect.

     Two transforms are composed, and the order matters:
       matrix(swing) matrix3d(closed)
     `closed` maps the flat 580 x 1297 elevation onto the trapezoid the leaf
     actually occupies in the painting (measured; see DOOR in the script), so
     at rest the leaf is pixel-for-pixel the painted door. `swing` is the exact
     affine image of a rotation about a vertical hinge under a parallel
     projection (§3.5) and is the identity at 0°, so composing the two cannot
     disturb the closed pose. Both act about transform-origin, which sits on
     the hinge line — the whole line is fixed by the rotation, so only its x
     matters. 808.5 px of 580 = 139.397%. */
  .door-leaf {
    position: absolute;
    left: 0; top: 0;
    width: 42.836%;                             /* 580 / 1354 */
    height: auto;
    /* The pose is ONE absolute matrix3d in the element's own box, so there is
       no origin to conjugate by and no transform list to order. 139.397%
       45.093% was correct when the swing was a separate factor in plate space;
       with the solved camera it is actively wrong. */
    transform-origin: 0 0;
    -webkit-user-drag: none;
  }
  /* THE SHADOW AND THE SHADE. The face shading and cast shadow used to be one
     doorLeafFilter() string rewritten on the leaf every frame; a drop-shadow()
     whose offset and blur both change defeats the compositor's filter cache,
     so the whole leaf re-rasterised per frame — measured at ~233 ms of
     RasterTask inside the 1.4 s swing at DPR 2 (the "door feels laggy" item
     in DECISIONS §16). Both are now their own <img> whose filter never
     changes, so they rasterise once and the per-frame writes are transform
     and opacity only — compositor work, like the props' hover fix. Both start
     at opacity 0, so the closed pose stays bit-identical to the painting. */
  .door-shadow {
    position: absolute;
    left: 0; top: 0;
    width: 57.016%;                             /* 772 / 1354 */
    height: auto;
    transform-origin: 0 0;
    opacity: 0;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .door-shade {
    position: absolute;
    left: 0; top: 0;
    width: 42.836%;                             /* 580 / 1354, the leaf's box */
    height: auto;
    transform-origin: 0 0;
    opacity: 0;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .door-edge {
    position: absolute;
    left: 0; top: 0;
    width: 2.363%;                              /* 32 / 1354 */
    height: auto;
    transform-origin: 0 0;
    opacity: 0;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .door-knob-twist {
    position: absolute;
    left: 45.077%; top: 50.585%;                /* the knob's rendered centre */
    width: 2.511%;                              /* 34 / 1354 */
    height: auto;
    translate: -50% -50%;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  /* Centred on the knob the leaf actually carries. The knob's dark pixels in
     assets/derived/just-door.png have their centroid at (60.4, 657.3), which
     the closed-pose homography puts at plate (610.3, 587.3) — 45.08% across
     and 50.59% down the 1354 x 1161 frame. */
  .door-knob {
    position: absolute;
    left: 45.077%; top: 50.585%;
    width: 7.6%; aspect-ratio: 1;
    translate: -50% -50%;
    padding: 0; border: 0; border-radius: 50%;
    /* Same ring treatment as .hotspot: the painted knob stays visible through
       the transparent centre (30% of the 44.8px farthest-corner radius keeps
       a clear hole over the 14.3px knob, with the bright band just outside). */
    background: radial-gradient(circle,
      rgb(255 248 228 / 0) 0%, rgb(255 248 228 / 0) 31%,
      rgb(255 250 234 / .5) 36%, rgb(255 226 150 / .22) 43%,
      rgb(255 214 130 / .06) 50%, rgb(255 205 100 / 0) 60%);
    cursor: pointer;
    animation: knobPulse 3.8s ease-in-out infinite;
    transition: opacity 300ms ease-out;
  }
  .door-knob:focus-visible { outline: none; box-shadow: 0 0 0 2px #fff, 0 0 0 5px #14161a; }

  /* Overexposure, not a cut to white: a white radial that grows and washes
     out from the doorway, so the scene blows out rather than being replaced.

     Deliberately NOT mix-blend-mode: screen. This element is inset:-60%, so
     it covers 2.2x the viewport in each axis, and it animates scale AND
     opacity for 1.75 s straight over the door art. A blend mode on that makes
     the compositor read the backdrop back every frame across the whole
     screen, which is the single most expensive thing in the transition. Over
     a light scene, white-over-alpha and white-screen are visually all but the
     same, so this buys the entire cost back for nothing. */
  .bloom {
    position: absolute;
    inset: -60%;
    pointer-events: none;
    background: radial-gradient(circle at 50% 49%, #fff 0%, #fff 24%, rgb(255 253 245 / .5) 45%, rgb(255 250 235 / 0) 70%);
    opacity: 0;
    transform-origin: 50% 50%;
  }

  /* ─────────────────────────────────────────────────────────────────────
     UI CHROME.  No backdrop-filter anywhere: its backdrop is the animating
     scene, so it would force a readback every frame.
     ───────────────────────────────────────────────────────────────────── */
  .ui { position: absolute; right: 12px; bottom: 12px; display: grid; gap: 8px; justify-items: end; }
  .pad { display: grid; grid-template-columns: repeat(3, 32px); grid-auto-rows: 32px; gap: 4px; }
  .pad button:nth-child(1) { grid-column: 2; }
  .row { display: flex; gap: 4px; }
  .pois { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: 48vw; }

  /* Scoped to the UI chrome only. An unscoped `button` rule here once painted
     the door knob solid white on hover — the knob and hotspots are buttons
     too, and their hover treatment is theirs alone. */
  .ui button {
    font: inherit;
    color: #14161a;
    background: rgb(255 255 255 / .92);
    border: 1px solid rgb(20 22 26 / .24);
    border-radius: 7px;
    padding: 0 9px;
    min-height: 26px;
    cursor: pointer;
  }
  .ui button:hover { background: #fff; }
  button:focus-visible { outline: none; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #14161a; }
  .pad button { padding: 0; }
  /* §6.6 — the rubber band is the signal that there is nothing more to see.
     Under reduced motion the band is gone, so the control has to say it. */
  button[aria-disabled="true"] { opacity: .42; cursor: default; }

  /* ─────────────────────────────────────────────────────────────────────
     DEBUG READOUT — toggled with D, visible by default.
     ───────────────────────────────────────────────────────────────────── */
  .hud {
    position: absolute;
    left: 12px; top: 12px;
    padding: 8px 10px;
    background: rgb(255 255 255 / .9);
    border: 1px solid rgb(20 22 26 / .22);
    border-radius: 8px;
    white-space: pre;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  .hint {
    position: absolute;
    left: 12px; bottom: 12px;
    max-width: 46ch;
    padding: 8px 10px;
    background: rgb(255 255 255 / .8);
    border: 1px solid rgb(20 22 26 / .16);
    border-radius: 8px;
    color: rgb(20 22 26 / .78);
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
  }

  /* §6.6 — reduced motion removes involuntary motion, never the interaction. */
  @media (prefers-reduced-motion: reduce) {
    .hotspot, .door-knob { animation: none; opacity: .85; }
    /* §6.6 — involuntary motion goes, the interaction stays. The wind is
       involuntary by definition, so every tree layer rests at identity: with
       no transforms the composition is simply the still painting. */
    .tree-layer, .seg { transform: none !important; }
    .prop__img, .prop::before { transition: none; }
  }
</style>

<body>
<div id="app">

  <!-- ── ROOM ─────────────────────────────────────────────────────────── -->
  <div class="viewport" id="viewport" tabindex="0" role="group"
       aria-label="Diorama room. Drag to pan, scroll or pinch to zoom. Arrow keys pan, plus and minus zoom, 0 resets."
       hidden>
    <div class="stage" id="stage">

      <!-- One composite image to assistive tech. §6.5(a) -->
      <div class="paint" role="img"
           aria-label="A cutaway model of a small office room on a plinth. A long wooden bench runs under a tall window, holding a clock, a stack of books, a folder, a notebook, an open laptop, a mug of coffee, a stack of photographs, a letter and pen, and an iPod. A swivel chair stands in front of it, a sticky note is stuck to the glass, and a cherry tree in blossom fills the window.">

        <!-- Base plate: the room SHELL only — walls, glass, carpet, plinth.
             Reference plane, depth factor 1.000. §4.2: splitting the desk out
             of this plate is the single asset change that decides whether the
             scene reads as a model or as a sticker. -->
        <div class="depth" data-z="0">
          <img class="art" src="assets/room-without-desk.png" alt=""
               width="1306" height="1205" draggable="false" style="left:0;top:0;width:100%">
          <img class="art art--night" src="assets/derived/room-night.png" alt=""
               width="1306" height="1205" draggable="false" style="left:0;top:0;width:100%">
        </div>

        <!-- Cherry tree seen through the two window apertures. Built by
             §5's buildWindows() from the WINDOWS table, because the layer's
             size is derived from the aperture and the layer's own parallax
             factor rather than hand-tuned. -->
        <div id="windows"></div>

        <!-- The desk, on its own plate in front of the shell. Placement is
             solved numerically, never eyeballed: see DESK in the script for the
             search and its residual. Built by buildDesk() so the one set of
             fitted numbers drives both the layer and the scale system. -->
        <div id="desk"></div>

        <!-- Everything that stands in the room. Built by §5's buildProps()
             from the PROPS table: each object states its real size in
             centimetres and where it touches the desktop, and its pixel size
             and position are derived. Nothing here is hand-sized, which is why
             adding an object is one row and no other change. -->
        <div id="props"></div>
      </div>

      <!-- Sibling of the painted stack, so it stays in the accessibility tree. -->
      <ul class="hotspots">
        <!-- Centred on the painted knob: its dark pixels' centroid on
             room-without-desk.png is (365,485) of 1306x1205 = 27.95%, 40.23%.
             .hotspot carries translate(-50%,-50%), so left/top ARE the centre. -->
        <li><button class="hotspot" id="exitKnob" type="button" data-nodrag
                    style="left:27.95%;top:40.23%;width:4.6%;aspect-ratio:1">
          <span class="sr-only">Leave the room and return to the door</span>
        </button></li>
      </ul>
    </div>
  </div>

  <!-- ── DOOR ─────────────────────────────────────────────────────────── -->
  <div class="door-scene" id="doorScene">
    <div class="door-frame" id="doorFrame">
      <!-- entry-base.png is a composite built offline (tools: see FIX-BRIEF):
           the doorless plate (without-door.png, so the corridor beyond is
           already painted and simply gets uncovered as the leaf swings off it)
           with the tree-free plate's EMPTY glass patched into the window, so
           the swaying branch stack can be composed behind the glass here just
           as it is inside the room. One plate, one leaf, one tree stack. -->
      <img class="plate" src="assets/entry-base.png"
           alt="A cutaway model of a small entryway on a plinth: a wooden door with a dark knob, a corridor beyond, and a cherry tree in blossom through the window."
           width="1353" height="1163" draggable="false">

      <!-- The window, with the same tree composition as the room's panes.
           Filled by buildEntryWindow(); the aperture polygon is measured off
           entry-no-tree.png by flood-filling the glass from a seed inside it. -->
      <div class="entry-window" id="entryWindow"></div>

      <!-- The leaf, inside the opening it can never leave. Its closed pose is a
           measured projective placement written by measureDoor(); the swing
           multiplies an affine on top of it. -->
      <div class="door-opening">
        <!-- The cast shadow, pre-blurred offline (tools/bake-door-shadow.py),
             clipped by the aperture; only shown for INWARD test poses. -->
        <img class="door-shadow" id="doorShadow" src="assets/derived/door-shadow.png" alt=""
             width="772" height="1489" draggable="false">
      </div>
      <!-- The leaf and companions sit OUTSIDE the clip since the swing went
           OUTWARD (2026-09-06): a door opening toward the viewer swings in
           FRONT of the wall, so the frame must not cut it. At rest the pose
           is pixel-identical to the painting either way. Edge slab first:
           when the projection folds it behind the face, the leaf paints over
           it. Shade last: a black baked copy at opacity (1 - b) equals
           brightness(b), rasterised once. -->
      <img class="door-edge" id="doorEdge" src="assets/derived/door-edge.png" alt=""
           width="32" height="1293" draggable="false">
      <img class="door-leaf" id="doorLeaf" src="assets/derived/just-door.png" alt=""
           width="580" height="1297" draggable="false">
      <img class="door-shade" id="doorShade" src="assets/derived/door-shade.png" alt=""
           width="580" height="1297" draggable="false">

      <!-- The knob, again, as a screen-aligned disc sliced from the plate at
           its rendered position — identical pixels over the painted knob, so
           invisible at rest. Rotating it during the knob beat sweeps the
           painted highlight: the twist the owner asked for. Hidden the moment
           the leaf starts moving, with the halo. -->
      <img class="door-knob-twist" id="knobTwist" src="assets/derived/door-knob.png" alt=""
           width="34" height="34" draggable="false">
      <button class="door-knob" id="enterKnob" type="button">
        <span class="sr-only">Open the door and enter the room</span>
      </button>
    </div>
  </div>

  <div class="bloom" id="bloom"></div>

  <!-- ── CHROME ───────────────────────────────────────────────────────── -->
  <!-- §6.5(b) WCAG SC 2.5.7: drag-to-pan is a failure without a
       single-pointer alternative. These are it. -->
  <div class="ui" id="ui" hidden>
    <div class="pois" id="pois"></div>
    <div class="row">
      <button type="button" data-cmd="zoom-out" id="btnOut" aria-label="Zoom out">&minus;</button>
      <button type="button" data-cmd="zoom-in" id="btnIn" aria-label="Zoom in">+</button>
      <button type="button" data-cmd="home">reset</button>
      <button type="button" data-cmd="exit">door</button>
    </div>
    <div class="pad">
      <button type="button" data-cmd="up" aria-label="Pan up">&uarr;</button>
      <button type="button" data-cmd="left" aria-label="Pan left">&larr;</button>
      <button type="button" data-cmd="down" aria-label="Pan down">&darr;</button>
      <button type="button" data-cmd="right" aria-label="Pan right">&rarr;</button>
    </div>
  </div>

  <div class="hud" id="hud"></div>
  <div class="hint" id="hint" hidden>drag to pan &middot; wheel or pinch to zoom &middot; arrows, + &minus; 0 &middot; D toggles this readout</div>
  <p class="sr-only" aria-live="polite" id="live"></p>
</div>

<script>
'use strict';

/* ══════════════════════════════════════════════════════════════════════
   §1  MATHS — pure, stateless, frame-rate independent.
   ══════════════════════════════════════════════════════════════════════ */

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

/** ω₀ from Apple's "response" parameterisation: ω₀ = 2π / response. §2.2 */
const omegaFromResponse = (r) => (2 * Math.PI) / r;

/**
 * Exact closed-form step of the damped harmonic oscillator. §2.2
 *
 * NOT semi-implicit Euler. Euler drifts with refresh rate — the report
 * measures 99.6004 at 60 Hz against 99.8032 at 240 Hz for the same
 * integration — which would make the scene feel materially different on a
 * 120 Hz display. The closed form is composable, step(a) then step(b) ===
 * step(a+b), so it is frame-rate independent by construction.
 *
 * Mutates `s` in place: this runs every frame and must not allocate.
 */
function stepSpring(s, target, w0, zeta, dt) {
  const d = s.x - target;
  if (zeta < 1) {                                   // underdamped: one soft overshoot
    const w = w0 * Math.sqrt(1 - zeta * zeta);
    const e = Math.exp(-zeta * w0 * dt);
    const cs = Math.cos(w * dt);
    const sn = Math.sin(w * dt);
    const A = (s.v + zeta * w0 * d) / w;
    const pos = d * cs + A * sn;
    s.x = target + e * pos;
    s.v = e * (-zeta * w0 * pos + (A * w * cs - d * w * sn));
    return s;
  }
  const e = Math.exp(-w0 * dt);                     // critically damped: never overshoots
  s.x = target + e * (d + (s.v + w0 * d) * dt);
  s.v = e * (s.v - w0 * dt * (s.v + w0 * d));
  return s;
}

/**
 * Apple's UIScrollView resistance curve. §2.4
 *   f(x) = (x·d·c) / (d + c·x),   c = 0.55 on iOS
 * Monotonic, and asymptotes to `give` however hard you pull. That asymptote
 * is the physical signal: progressively harder, visibly refusing.
 */
const rubberband = (overshoot, give, c) => (overshoot * give * c) / (give + c * overshoot);

/** Project a raw value into [min,max] with soft resistance outside. §2.4 */
function bandTo(v, min, max, give, c) {
  if (max < min) { const mid = (min + max) / 2; min = mid; max = mid; }
  if (give <= 0 || c <= 0) return clamp(v, min, max);   // reduced motion degenerates to a hard clamp
  if (v < min) return min - rubberband(min - v, give, c);
  if (v > max) return max + rubberband(v - max, give, c);
  return v;
}

/**
 * Zoom by `dz` log-units keeping the viewport point (px,py) pinned. §2.1
 *
 *   w = (p − t)/k   and   w·k′ + t′ = p    ⟹    t′ = p − (p − t)·(k′/k)
 *   and k′/k = e^dz, so k drops out of the anchoring step entirely.
 *
 * Working in z = ln(scale) also removes the zoom-in/zoom-out asymmetry:
 * exp(+dz)·exp(−dz) === 1 exactly.
 */
function zoomAbout(cam, px, py, dz) {
  const s = Math.exp(dz);
  cam.z += dz;
  cam.x = px - (px - cam.x) * s;
  cam.y = py - (py - cam.y) * s;
  return cam;
}

/** Pan limits at a given zoom; centres the stage when it is smaller than the view. §2.1 */
function panBounds(world, view, z, margin) {
  const k = Math.exp(z);
  const axis = (content, viewport) =>
    content + 2 * margin >= viewport
      ? { min: viewport - content - margin, max: margin }
      : { min: (viewport - content) / 2, max: (viewport - content) / 2 };
  return { x: axis(world.w * k, view.w), y: axis(world.h * k, view.h) };
}

/* Wheel normalisation. §2.6 — there is no cross-browser meaning to a delta;
   the spec itself says authors cannot assume one. */
const LINE_PX = 16;
const PAGE_PX = 400;
const PINCH_GAIN = 2.2;
const WHEEL_NOTCH = 0.16;      // ln-units per detent ≈ 17% per click

function normalizeWheel(e) {
  let dx = e.deltaX, dy = e.deltaY;
  if (dx === 0 && e.shiftKey) { dx = dy; dy = 0; }                // horizontal wheel arrives as shift+deltaY
  if (e.deltaMode === 1) { dx *= LINE_PX; dy *= LINE_PX; }        // DOM_DELTA_LINE
  else if (e.deltaMode === 2) { dx *= PAGE_PX; dy *= PAGE_PX; }   // DOM_DELTA_PAGE
  return { dx: dx, dy: dy };
}

/** Pinch → log-scale delta. Symmetric by construction: dz(+d) + dz(−d) === 0. */
function dzFromPinch(dyNorm, gain) {
  const g = gain === undefined ? PINCH_GAIN : gain;
  const dy = Math.sign(dyNorm) * Math.min(24, Math.abs(dyNorm));  // Burzo's clamp
  return -Math.sign(dy) * Math.log(1 + Math.abs((g * dy) / 100));
}

/** Mouse wheel → log-scale delta. Magnitude deliberately discarded. §2.6 */
const dzFromNotch = (dyNorm) => -Math.sign(dyNorm) * WHEEL_NOTCH;

/** Apparent scale of a flat plane at notional depth z under perspective P. §4.1 */
const depthFactor = (z, P) => P / (P - z);

const DioramaMath = Object.freeze({
  clamp, omegaFromResponse, stepSpring, rubberband, bandTo,
  zoomAbout, panBounds, normalizeWheel, dzFromPinch, dzFromNotch, depthFactor
});

/* ══════════════════════════════════════════════════════════════════════
   §2  VELOCITY TRACKER — §2.9
       Sliding first-vs-last window over ~100 ms. A last-frame delta is far
       too noisy: one 8 ms frame with 1 px of jitter reads as 125 px/s.
   ══════════════════════════════════════════════════════════════════════ */
function createVelocityTracker(windowMs) {
  const s = [];
  return {
    reset() { s.length = 0; },
    add(t, x, y) {
      s.push({ t: t, x: x, y: y });
      const cut = t - windowMs;
      while (s.length > 2 && s[0].t < cut) s.shift();
    },
    get() {
      const n = s.length;
      if (n < 2) return { vx: 0, vy: 0 };
      const a = s[0], b = s[n - 1];
      const dt = (b.t - a.t) / 1000;
      if (dt <= 1e-4) return { vx: 0, vy: 0 };
      return { vx: (b.x - a.x) / dt, vy: (b.y - a.y) / dt };
    }
  };
}

/* ══════════════════════════════════════════════════════════════════════
   §3  WHEEL DEVICE HEURISTIC — §2.6
       Flagged UNVERIFIED in the report: no API reports the input device and
       these weights are untested on hardware. What makes a misclassification
       survivable rather than fatal ships alongside it — visible +/−
       buttons, keyboard zoom, and ctrl/cmd+wheel as an explicit override.
   ══════════════════════════════════════════════════════════════════════ */
function createWheelClassifier() {
  let mode = null;
  let last = 0;
  return function classify(e, now) {
    if (now - last > 500) mode = null;              // latch, so one misread cannot flip mid-gesture
    last = now;
    if (mode) return mode;
    const ay = Math.abs(e.deltaY);
    let score = 0;                                  // + = wheel, − = trackpad
    if (e.deltaMode !== 0) score += 3;              // strongest signal
    if (!Number.isInteger(e.deltaY)) score -= 3;
    if (e.deltaX !== 0) score -= 1;
    if (e.deltaMode === 0 && ay >= 40 && ay % 20 === 0) score += 2;
    if (e.deltaMode === 0 && ay > 0 && ay < 12) score -= 1;
    mode = score >= 1 ? 'wheel' : 'trackpad';
    return mode;
  };
}

/* ══════════════════════════════════════════════════════════════════════
   §4  CAMERA + PHYSICS — the whole of the "silky".

       No DOM, no rAF, no performance.now(). Every entry point takes the
       clock as an argument and `step(dt, now)` advances one frame, so a
       harness can run it deterministically at any refresh rate.

       THE ANCHOR RULE. `anchor` is the viewport point the zoom holds fixed,
       and stepZoom() re-applies it on every frame the z spring moves — for
       whatever reason it moves. So there must be no way to disturb z
       without naming the anchor in the same call. Every public method that
       can move z (zoomBy, zoomTo, flyTo, home, setViewport) sets it. That
       is not decoration: the bug this prototype was written to catch was a
       zoom that sprang about a stale anchor left over from a previous
       gesture, which drags the whole room sideways as it settles.
   ══════════════════════════════════════════════════════════════════════ */
function createCamera(options) {
  const world = options.world;
  const pois = options.pois;

  /* Everything here except bandC and Apple's 0.55 is a judgement number the
     report explicitly refuses to source. These are the hand-tuning knobs. */
  const cfg = {
    homeFill: 0.88,                       // fraction of the viewport the room fills at home
    /* Scene-supplied framing. The physics does not care where home is; the
       composition does, and it is the composition that knows the objects are
       small. Defaults reproduce the whole-room-centred behaviour exactly. */
    homeBoost: 1,                         // home is this much closer than that fit
    homeFocus: null,                      // { x, y } world point held at the centre
    zOutLog: Math.log(1.3),               // how much wider than home you may pull
    zInLog: Math.log(4.2),                // how much closer than home you may push
    w0Track: omegaFromResponse(0.15),     // tracking a live discrete input
    w0Settle: omegaFromResponse(0.42),    // settling, and the return from a limit
    w0Fly: omegaFromResponse(0.55),       // magnetic settle onto a point of interest
    zetaBounce: 0.86,                     // ζ<1 ONLY when returning from past a limit
    panGive: 0,                           // set by setViewport(): 18% of the short side
    zGive: Math.log(1.6),                 // never more than 60% past a zoom limit, §2.5
    bandC: 0.55,                          // Apple's constant
    tau: 0.26,                            // momentum time constant, §2.10
    momentum: true,
    idleMs: 110,                          // "the user stopped" threshold, §2.5
    minFling: 60,                         // px/s below which we do not glide at all
    restPx: 0.5,                          // Motion's own inertia restDelta
    restZ: 0.0008,
    /* A spring approaches its target asymptotically and never arrives, so
       without an explicit rest test the camera keeps emitting new — visually
       identical — transform strings forever, and §3.3's raster hand-back never
       fires: will-change stays pinned ON, which is the exact failure mode that
       makes zoomed art go soft. So snap to the target once the remaining error
       is below what the rendered transform can express. The stage writes
       translate to 2 dp and scale to 5 dp, so 0.004 px and 2e-6 log units
       (< 1e-5 of k at this scene's maximum k) are both under the last digit. */
    snapPx: 0.004,
    snapVpx: 0.4,
    snapZ: 2e-6,
    snapVz: 2e-4,
    magDz: Math.log(1.28),                // magnet capture radius, log-scale units
    magDs: 0.14,                          // magnet capture radius, fraction of short side
    magRearm: 1.6                         // hysteresis, so a snap cannot re-fire instantly
  };

  /** The rendered camera. z = ln(scale). §2.1 */
  const cam = { x: 0, y: 0, z: 0 };
  const view = { w: 1, h: 1 };
  const limits = { zMin: 0, zMax: 0, zHome: 0 };
  const anchor = { x: 0, y: 0 };

  /** One smoothed axis: a raw intent that may run past the limits, plus the
      spring state actually rendered. Band the OUTPUT, never the state (§2.4) —
      banding the stored value makes a reversal feel dead for the first pixels. */
  const makeAxis = () => ({ intent: 0, s: { x: 0, v: 0 }, bounce: false });
  const axX = makeAxis();
  const axY = makeAxis();
  const axZ = makeAxis();

  let glide = null;                     // { vx, vy } px/s
  let dragging = false;
  let directZoom = false;               // touch pinch: direct manipulation, so no smoothing
  let magnet = null;                    // { poi }
  let magnetArmed = false;
  let interacted = false;
  let reduce = false;
  let lastPanInput = -1e9;
  let lastZoomInput = -1e9;
  let sized = false;

  const setAnchor = (px, py) => { anchor.x = px; anchor.y = py; };

  /* ── framing ──────────────────────────────────────────────────────── */

  /**
   * Resize. The limits are derived from the viewport, so a resize can move
   * the z spring's target on its own — which is exactly the situation the
   * anchor rule exists for. Re-anchor to the new centre, rebase z by the
   * shift in zHome, and re-solve the pan so the world point that was
   * centred stays centred. Nothing springs; a resize is not an animation.
   */
  function setViewport(w, h) {
    const kOld = Math.exp(cam.z);
    const cx = sized ? (view.w * 0.5 - cam.x) / kOld : world.w / 2;
    const cy = sized ? (view.h * 0.5 - cam.y) / kOld : world.h / 2;
    const zHomeOld = limits.zHome;

    view.w = w;
    view.h = h;
    const fit = Math.min(w * cfg.homeFill / world.w, h * cfg.homeFill / world.h);
    limits.zHome = Math.log(fit * cfg.homeBoost);
    limits.zMin = limits.zHome - cfg.zOutLog;
    limits.zMax = limits.zHome + cfg.zInLog;
    cfg.panGive = reduce ? 0 : Math.min(w, h) * 0.18;
    setAnchor(w * 0.5, h * 0.5);

    if (!sized) { sized = true; home(0); return; }
    if (!interacted) { home(0); return; }

    const z = clamp(axZ.s.x + (limits.zHome - zHomeOld), limits.zMin, limits.zMax);
    const k = Math.exp(z);
    setAll(w * 0.5 - cx * k, h * 0.5 - cy * k, z);
  }

  /** Snap every axis — intent, spring position, spring velocity — to one pose. */
  function setAll(x, y, z) {
    axZ.intent = z; axZ.s.x = z; axZ.s.v = 0; axZ.bounce = false;
    axX.intent = x; axX.s.x = x; axX.s.v = 0; axX.bounce = false;
    axY.intent = y; axY.s.x = y; axY.s.v = 0; axY.bounce = false;
    cam.x = x; cam.y = y; cam.z = z;
    glide = null;
    magnet = null;
    magnetArmed = false;
  }

  /**
   * Frame the whole room. A non-zero `zOffsetLog` starts the camera that
   * much closer and leaves the z spring pointed at home, so the room
   * resolves outward — which is how the door transition lands.
   */
  function home(zOffsetLog) {
    const z = clamp(limits.zHome + (zOffsetLog || 0), limits.zMin, limits.zMax);
    const k = Math.exp(z);
    const fx = cfg.homeFocus ? cfg.homeFocus.x : world.w / 2;
    const fy = cfg.homeFocus ? cfg.homeFocus.y : world.h / 2;
    // Clamp to the legal pan region, or the first frame springs back off a pose
    // that was never reachable. A world-centred home is always inside it, so
    // this changes nothing for the default framing.
    const b = panBounds(world, view, z, 0);
    setAll(clamp(view.w * 0.5 - fx * k, b.x.min, b.x.max),
           clamp(view.h * 0.5 - fy * k, b.y.min, b.y.max), z);
    axZ.intent = limits.zHome;          // the residual z the spring will unwind
    setAnchor(view.w * 0.5, view.h * 0.5);
  }

  /**
   * The cursor anchor moves the translation, so every quantity living in
   * translation space must move with it under the same affine map, or intent,
   * rendered position and velocity drift apart. §2.5
   */
  function applyAnchor(px, py, dz) {
    const s = Math.exp(dz);
    zoomAbout(cam, px, py, dz);
    axX.intent = px - (px - axX.intent) * s;
    axY.intent = py - (py - axY.intent) * s;
    axX.s.x = px - (px - axX.s.x) * s;
    axY.s.x = py - (py - axY.s.x) * s;
    axX.s.v *= s;                                     // an affine map scales velocity by s
    axY.s.v *= s;
    if (glide) { glide.vx *= s; glide.vy *= s; }
  }

  /* ── momentum ─────────────────────────────────────────────────────── */

  /**
   * §2.10 — amplitude = v₀·τ, NOT the widely-copied 0.8·v₀.
   * With x(t) = target − A·e^(−t/τ) the initial speed is A/τ, so A = 0.8·v₀ at
   * τ = 0.325 launches at 2.46× the release velocity: a visible kick on every
   * flick. A = v₀·τ starts at exactly v₀, which is C1-continuous with the drag.
   */
  function stepMomentum(dt) {
    if (!glide) return;
    const decay = Math.exp(-dt / cfg.tau);            // exact integration of v′ = −v/τ
    axX.intent += glide.vx * cfg.tau * (1 - decay);
    axY.intent += glide.vy * cfg.tau * (1 - decay);
    glide.vx *= decay;
    glide.vy *= decay;

    // Hand off to the settle spring on leaving the legal region, seeded with the
    // glide velocity at that instant, so glide → bounce reads as one motion and
    // not as two animations stitched together.
    const b = panBounds(world, view, cam.z, 0);
    if (glide.vx !== 0 && (axX.intent < b.x.min || axX.intent > b.x.max)) { axX.s.v = glide.vx; glide.vx = 0; }
    if (glide.vy !== 0 && (axY.intent < b.y.min || axY.intent > b.y.max)) { axY.s.v = glide.vy; glide.vy = 0; }

    if (glide.vx === 0 && glide.vy === 0) { glide = null; return; }
    if (Math.abs(glide.vx * cfg.tau) < cfg.restPx &&
        Math.abs(glide.vy * cfg.tau) < cfg.restPx) glide = null;
  }

  /* ── one axis of the pan ──────────────────────────────────────────── */
  function stepPanAxis(a, min, max, live, direct, dt) {
    let target;
    if (live) {
      target = bandTo(a.intent, min, max, cfg.panGive, cfg.bandC);
    } else {
      const c = clamp(a.intent, min, max);
      if (c !== a.intent) { a.intent = c; a.bounce = cfg.panGive > 0; }  // release the stretch
      target = c;
    }
    if (direct) {
      // Direct manipulation is NEVER smoothed (§2.3). Rendered === banded intent,
      // and the spring's velocity is kept warm for the release handoff.
      a.s.v = (target - a.s.x) / dt;
      a.s.x = target;
      return;
    }
    stepSpring(a.s, target, live ? cfg.w0Track : cfg.w0Settle,
               a.bounce ? cfg.zetaBounce : 1, dt);
    if (a.bounce && Math.abs(a.s.x - target) < cfg.restPx && Math.abs(a.s.v) < 8) a.bounce = false;
    if (!live && Math.abs(a.s.x - target) < cfg.snapPx && Math.abs(a.s.v) < cfg.snapVpx) {
      a.s.x = target; a.s.v = 0;                      // arrive, so the loop can go quiet
    }
  }

  /* ── zoom ─────────────────────────────────────────────────────────── */
  function stepZoom(dt, now) {
    const live = directZoom || (now - lastZoomInput < cfg.idleMs);
    let target;

    if (live) {
      target = bandTo(axZ.intent, limits.zMin, limits.zMax, cfg.zGive, cfg.bandC);
    } else {
      const c = clamp(axZ.intent, limits.zMin, limits.zMax);
      if (c !== axZ.intent) { axZ.intent = c; axZ.bounce = cfg.zGive > 0; }
      target = c;
    }

    const prev = axZ.s.x;
    if (directZoom) {
      axZ.s.v = (target - axZ.s.x) / dt;
      axZ.s.x = target;
    } else {
      // Switching ω₀ and ζ between live and settling is a discontinuity in the
      // parameters, not the state: position and velocity carry across untouched.
      const w0 = magnet ? cfg.w0Fly : (live ? cfg.w0Track : cfg.w0Settle);
      stepSpring(axZ.s, target, w0, axZ.bounce ? cfg.zetaBounce : 1, dt);
      if (axZ.bounce && Math.abs(axZ.s.x - target) < cfg.restZ && Math.abs(axZ.s.v) < 0.02) {
        axZ.bounce = false;
      }
      if (!live && !magnet && Math.abs(axZ.s.x - target) < cfg.snapZ && Math.abs(axZ.s.v) < cfg.snapVz) {
        axZ.s.x = target; axZ.s.v = 0;
      }
    }

    // Re-apply the cursor anchor with the RENDERED delta, not the raw one. §2.5
    const dz = axZ.s.x - prev;
    if (dz !== 0) applyAnchor(anchor.x, anchor.y, dz);
    else cam.z = axZ.s.x;
  }

  /* ── magnetic settle ──────────────────────────────────────────────── */
  function poiTargetZ(poi) {
    const k = Math.min(view.w / (poi.w * 1.22), view.h / (poi.h * 1.22));
    return clamp(Math.log(k), limits.zMin, limits.zMax);
  }

  /** Normalised distance from the current camera to a POI's composed framing. */
  function poiScore(poi) {
    const k = Math.exp(cam.z);
    const sx = cam.x + poi.x * k;                     // the POI's current screen position
    const sy = cam.y + poi.y * k;
    const dz = (cam.z - poiTargetZ(poi)) / cfg.magDz;
    const ds = Math.hypot(sx - view.w * 0.5, sy - view.h * 0.5) /
               (Math.min(view.w, view.h) * cfg.magDs);
    return Math.hypot(dz, ds);
  }

  function considerMagnet(now) {
    if (dragging || glide || magnet || !interacted) return;
    if (now - lastPanInput < 140 || now - lastZoomInput < 140) return;

    let best = null, bestScore = Infinity;
    for (let i = 0; i < pois.length; i++) {
      const sc = poiScore(pois[i]);
      if (sc < bestScore) { bestScore = sc; best = pois[i]; }
    }
    if (!magnetArmed) { if (bestScore > cfg.magRearm) magnetArmed = true; return; }
    if (bestScore <= 1) { magnet = { poi: best }; magnetArmed = false; }
  }

  /**
   * While the magnet converges, the zoom anchor is the POI itself. The anchored
   * zoom then pins the object on screen and the pan spring only has to slide it
   * to centre — the two become orthogonal instead of fighting each other.
   */
  function prepMagnet() {
    const k = Math.exp(cam.z);
    setAnchor(cam.x + magnet.poi.x * k, cam.y + magnet.poi.y * k);
    axZ.intent = poiTargetZ(magnet.poi);
  }

  function stepMagnetPan(dt) {
    const k = Math.exp(cam.z);
    const tx = view.w * 0.5 - magnet.poi.x * k;       // recomputed from the CURRENT k
    const ty = view.h * 0.5 - magnet.poi.y * k;
    stepSpring(axX.s, tx, cfg.w0Fly, 1, dt);
    stepSpring(axY.s, ty, cfg.w0Fly, 1, dt);
    axX.intent = axX.s.x;
    axY.intent = axY.s.x;

    if (Math.abs(axZ.s.x - axZ.intent) < cfg.restZ &&
        Math.abs(axX.s.x - tx) < cfg.restPx &&
        Math.abs(axY.s.x - ty) < cfg.restPx) magnet = null;
  }

  /* ── the frame ────────────────────────────────────────────────────── */
  function step(dt, now) {
    if (magnet) prepMagnet();
    stepMomentum(dt);
    stepZoom(dt, now);

    if (magnet) {
      stepMagnetPan(dt);
    } else {
      // Bounds depend on z, so they move under the band during a simultaneous
      // zoom-and-pan. Recompute every frame: six arithmetic operations. §2.4
      const b = panBounds(world, view, cam.z, 0);
      const glideX = !!glide && glide.vx !== 0;
      const glideY = !!glide && glide.vy !== 0;
      const recent = now - lastPanInput < cfg.idleMs;
      stepPanAxis(axX, b.x.min, b.x.max, dragging || glideX || recent, dragging || glideX, dt);
      stepPanAxis(axY, b.y.min, b.y.max, dragging || glideY || recent, dragging || glideY, dt);
    }

    cam.x = axX.s.x;
    cam.y = axY.s.x;
    considerMagnet(now);
  }

  /* ── public input surface ─────────────────────────────────────────── */
  function cancelMotion() { glide = null; magnet = null; }

  function panBy(dx, dy, now) {
    cancelMotion();
    interacted = true;
    axX.intent += dx;
    axY.intent += dy;
    lastPanInput = now;
  }

  /** Smoothed zoom by a log delta, held about (px,py). Wheel, keyboard, buttons. */
  function zoomBy(dz, px, py, now) {
    cancelMotion();
    interacted = true;
    setAnchor(px, py);
    axZ.intent += dz;                                 // may exceed the limits — that is the point
    lastZoomInput = now;
  }

  /** Absolute zoom, held about (px,py). Pinch: direct, so never smoothed. */
  function zoomTo(z, px, py, now) {
    interacted = true;
    setAnchor(px, py);
    axZ.intent = z;
    lastZoomInput = now;
  }

  function beginDrag(now) {
    cancelMotion();                                   // an interrupting grab kills the glide
    interacted = true;
    dragging = true;
    lastPanInput = now;
  }

  function dragBy(dx, dy, now) {
    axX.intent += dx;                                 // 1:1, zero smoothing
    axY.intent += dy;
    lastPanInput = now;
  }

  function endDrag(vx, vy, now) {
    dragging = false;
    glide = (!cfg.momentum || Math.hypot(vx, vy) < cfg.minFling) ? null : { vx: vx, vy: vy };
    lastPanInput = now;
  }

  function beginPinch(now) { cancelMotion(); interacted = true; dragging = false; directZoom = true; lastZoomInput = now; }
  function endPinch(now) { directZoom = false; lastZoomInput = now; }
  function resumeDrag(now) { dragging = true; lastPanInput = now; }

  function flyTo(poi) {
    interacted = true;
    glide = null;
    magnet = { poi: poi };
    magnetArmed = false;
    prepMagnet();                                     // names the anchor before z can move
  }

  function setReducedMotion(off) {
    reduce = off;
    // One code path: the time constants collapse and `give` goes to zero,
    // which turns bandTo into a hard clamp. §6.6
    cfg.w0Track = omegaFromResponse(off ? 0.001 : 0.15);
    cfg.w0Settle = omegaFromResponse(off ? 0.001 : 0.42);
    cfg.w0Fly = omegaFromResponse(off ? 0.001 : 0.55);
    cfg.zGive = off ? 0 : Math.log(1.6);
    cfg.momentum = !off;
    cfg.panGive = off ? 0 : Math.min(view.w, view.h) * 0.18;
  }

  /** '' | 'min' | 'max' — drives the aria-live text and the +/− button states. */
  function zoomLimitState() {
    if (axZ.s.x >= limits.zMax - 1e-3) return 'max';
    if (axZ.s.x <= limits.zMin + 1e-3) return 'min';
    return '';
  }

  /** True while anything could still move, including a held-still drag. The
      velocity terms are exact comparisons because the springs snap to rest. */
  function isBusy(now) {
    return dragging || directZoom || !!glide || !!magnet ||
           now - lastPanInput < cfg.idleMs || now - lastZoomInput < cfg.idleMs ||
           axZ.s.v !== 0 || axX.s.v !== 0 || axY.s.v !== 0;
  }

  function mode(now) {
    if (dragging) return 'drag';
    if (directZoom) return 'pinch';
    if (glide) return 'glide';
    if (magnet) return 'magnet:' + magnet.poi.id;
    if (now - lastPanInput < cfg.idleMs || now - lastZoomInput < cfg.idleMs) return 'input';
    if (axZ.bounce || axX.bounce || axY.bounce) return 'bounce';
    return 'rest';
  }

  return {
    cam: cam, view: view, limits: limits, cfg: cfg, anchor: anchor,
    setViewport, setReducedMotion, home, step,
    panBy, zoomBy, zoomTo, beginDrag, dragBy, endDrag,
    beginPinch, endPinch, resumeDrag, flyTo, cancelMotion,
    zoomLimitState, isBusy, mode
  };
}

/* ══════════════════════════════════════════════════════════════════════
   §5  SCENE DATA — this file's artwork. The camera above never sees it.
   ══════════════════════════════════════════════════════════════════════ */

const WORLD = { w: 1306, h: 1205 };                 // base plate natural size == .stage box

/* §4.1 — layers are authored as notional depths in data-z and converted once
   to the constant pan multiplier s = P/(P − z):
     tree, both windows  z = −1200   s = 0.600
     room shell          z =     0   s = 1.000   (reference plane)
     sticky note (glass) z =     0   s = 1.000   stuck to the pane, so no slide
     desk                z =  +130   s = 1.078
     everything ON the desk           s = 1.078  — SAME layer as the desk
     chair               z =  +200   s = 1.125
   Two deliberate choices here, both answering "everything looks out of place":

   (a) Every desktop object shares the desk's depth EXACTLY. Give a mug even a
       slightly different multiplier and it slides across the wood as you pan,
       which reads as the object floating; correctness of contact is worth more
       than a few extra pixels of parallax on a 4 cm object.
   (b) Both apertures show the SAME tree, so both get the same depth. They had
       −1800 and −1200, which pulled one copy of one tree in two directions.
   Spread is now 0.60 … 1.125, about 1.9x, down from 2.3x. */
const PERSPECTIVE = 1800;

/* ══════════════════════════════════════════════════════════════════════
   SCALE SYSTEM — ONE source of truth for how big anything is.

   Every object states its real-world size in centimetres. Its pixel size is
   derived. No object is ever hand-tuned to "look about right", because that
   is how the clock ended up 46 cm tall.

   THE ANCHOR IS THE DESK, MEASURED VERTICALLY.
   In assets/desk-only.png (1107 x 809) the back-left leg stands at x = 70.
   Care: at x = 70 the top face's BACK edge is at y = 101, but the leg is at
   the FRONT of the desk. The work surface directly above the leg is the front
   edge at y = 168 (column dump: bright top face 101..167, front-edge highlight
   at 167, slab face 169..191, leg 193..377). Foot at y ≈ 378, so the 73 cm
   stand-off is 210 source px, not 270 — the audit caught the back-edge misread
   inflating the vertical scale by 28.6%. The desk plate is laid into the room
   at scale 0.461 (fitted numerically, see DESK), so

       PX_PER_CM_UP = 210 * 0.461 / 73 = 1.3262 stage px per cm

   The bench itself, from the committed constants: top face 438.7 x 126.0
   stage px = 331 x 95 cm at this scale — a full-wall bench, not a 1.8 m desk.
   Vertical is the axis this projection does not foreshorten at all, so props
   that stand quote a height and use axis 'up'. Props lying on the desktop
   quote their projected image extent and use axis 'along' — that quoted value
   is ALREADY a projected extent, which is why FORESHORTEN below is 1.0: the
   earlier cos(30°) applied projection twice and shrank everything lying flat
   by a further ~15% (the audit measured the combined error at ~1.6x).
   ══════════════════════════════════════════════════════════════════════ */
/* ── THE DESK, SOLVED NUMERICALLY ──────────────────────────────────────
   assets/desk-only.png is composited over assets/room-without-desk.png and the
   result compared, pixel for pixel, against the original ONE-PIECE plate
   reference/new-design/empty room.png, which still has the desk in it. Squared
   error over (x, y, scale), coarse-to-fine at 1/4, 1/2 and full resolution,
   over a fixed 700 x 500 ROI covering the desk and the floor around it.

   Photometric best fit: x = 478, y = 472, scale = 0.461 (RMS 27.97 vs 40.98
   with no desk; 15.08 is the floor). BUT that fit put the desk's rightmost
   foot 101 px OUTSIDE the carpet — the one-piece render itself drew the desk
   slightly through the glass, so matching it faithfully reproduced its error.

   The placement is therefore constrained by physics instead: every real foot
   must stand on carpet. Feet read off the derived asset (alpha>200 and not the
   converted shadow): back-left (69,376), front-right (838,800), right end
   (1029,670). Largest scale / rightmost x satisfying all three:

       x = 414, y = 470, scale = 0.462   — right foot 1 px from the glass line.

   FOUR LEGS. The original render had only three (no back-right leg — the
   corner floated). desk-4legs.png is that same render with the fourth leg
   grafted in Python: the back-left leg (same depth, so same lighting) copied
   to descend from the far top-face corner T(342,182 in the 1305 x 1206 frame)
   for 238 px, painted only over background, never over the slab. Same crop,
   1109 x 810 vs 1107 x 809, so the fitted placement carries over unchanged. */
const DESK = {
  /* ONE PAINTING now (owner's P5 generation, 2026-09-06): the desk and all
     ten still objects in a single coherent perspective and light. The chair,
     jelly, sticky note and clock hands stay live. Fit solved so the bench's
     world length and centre match the old desk exactly — nothing else moved. */
  src: 'assets/derived/desk-scene.png',
  w: 1389, h: 1206,   /* +246: legs extended to the room's floor line */
  fitX: 435.6, fitY: 425.9, fitScale: 0.3468,
  z: 130,
  /* The desktop's top face, read off the desk asset's own alpha: the extreme
     points of the wood mask in each of the four diagonal directions, which for
     this parallelogram are its corners. Left (8,133), Top (251,8),
     Right (1099,440); the fourth follows as L + R − T = (856,565) and lands on
     the painted near corner to within a pixel.
       along = L -> N, the length of the bench, left end to right end
       depth = L -> T, front edge to back edge
     Anything that sits on the desk is placed as (u along, v across). */
  faceL: [4, 225],
  faceAlong: [1034, 734],
  faceDepth: [308, -166],
  vertPx: 280,                              // work surface (front edge, y=168) to leg foot, at x = 70
  heightCm: 73
};
const SRC_TO_STAGE = DESK.fitScale;
const PX_PER_CM_UP = DESK.vertPx * SRC_TO_STAGE / DESK.heightCm;
/* 'along' cm values are already projected image extents — do not project twice.
   The old cos(30°) here compounded with the vertPx misread to make everything
   lying on the desktop ~1.6x too small (audit, proportions lens). */
const FORESHORTEN = 1.0;
const PX_PER_CM_ALONG = PX_PER_CM_UP * FORESHORTEN;

/* THE ONE FUDGE, AND IT IS EXPLICIT.
   The room is genuinely large — a ~3.3 m bench in a ~4.8 m room — so a 9 cm mug
   drawn honestly is unreadable and unclickable at any framing that shows the
   room. Every object therefore runs one global factor over life size. It lives
   here, once, and the PROPS table below stays in real centimetres, so the
   proportions between objects remain exactly right and the size of the lie is
   a single number anyone can change. 2.00 was solved against the approved art
   (which itself draws desk objects at ~3.14 px/cm equivalent, so this is still
   the conservative side of what the art licenses). */
const OBJECT_SCALE_BOOST = 1.50;

/** A point on the desktop. u runs 0..1 along the bench, v 0..1 front to back.
    Returns stage pixels. */
function deskPoint(u, v) {
  return {
    x: DESK.fitX + SRC_TO_STAGE * (DESK.faceL[0] + u * DESK.faceAlong[0] + v * DESK.faceDepth[0]),
    y: DESK.fitY + SRC_TO_STAGE * (DESK.faceL[1] + u * DESK.faceAlong[1] + v * DESK.faceDepth[1])
  };
}

/* ── THE OBJECT TABLE ──────────────────────────────────────────────────
   src   file under assets/derived/ — the prepared cut-outs, baked contact
         shadow removed, see tools/prepare-assets.py
   w,h   the source PNG's natural size. These are tight crops with a 2 px
         transparent margin, so the content box IS the image and there is no
         `box` column any more: the whole class of "the bbox fraction was
         guessed" errors is gone with it.
   cm    the object's REAL size, and `axis` says which one:
           'up'    a height, straight up the picture     -> PX_PER_CM_UP
           'along' a width in the room's receding plane  -> PX_PER_CM_ALONG
         Objects that stand get 'up'; objects lying on the desktop get 'along',
         because their image height is an in-plane length seen foreshortened
         and reading it as a height would size them completely wrong.
   on    'desk' -> `at` is (u along the bench, v across it), fed through
         deskPoint() so the object touches the wood by construction
         'world' -> `at` is a fraction of the world box
   foot  which point of the image that touches down; [0.5, 1] = bottom centre
   shadow  [width as a fraction of the object's width, height as a fraction of
         THAT width, blur px, how far the ellipse sits above the image's
         bottom edge as a fraction of the object's height] — the contact
         shadow drawn under it in CSS

   Left to right along the bench. Everything is real centimetres; nothing here
   is hand-sized. OBJECT_SCALE_BOOST is the only multiplier. */
const PROPS = [
  /* LAYOUT PRINCIPLE: one used desk, not two piles. Back row (v ≥ 0.6) is
     the reference shelf: clock, books, lamp, folder, mug. Front row (v ≤ 0.4)
     is the working zone in front of the sitter: notebook, laptop (facing the
     chair), letter, photos, iPod. Rows are listed back-to-front so DOM order
     is paint order within the shared desk depth. */

/**
 * cm -> geometry. Pure. Returns the layer box in stage pixels plus the framing
 * box a POI wants. The assets are tight crops, so image box == content box.
 */
function layoutProp(p) {
  const target = p.cm * (p.axis === 'up' ? PX_PER_CM_UP : PX_PER_CM_ALONG) * OBJECT_SCALE_BOOST;
  const imgW = p.axis === 'up' ? target * p.w / p.h : target;
  const imgH = imgW * p.h / p.w;

  let foot;
  if (p.on === 'desk') {
    foot = deskPoint(p.at[0], p.at[1]);
  } else if (p.on === 'floor') {
    // the same desktop parameterisation, then straight down by the desk's own
    // height, which is the one distance in this drawing that is not
    // foreshortened at all
    const d = deskPoint(p.at[0], p.at[1]);
    foot = { x: d.x, y: d.y + DESK.heightCm * PX_PER_CM_UP };
  } else {
    foot = { x: p.at[0] * WORLD.w, y: p.at[1] * WORLD.h };
  }

  const left = foot.x - p.foot[0] * imgW;
  const top = foot.y - p.foot[1] * imgH;
  return {
    prop: p,
    left: left, top: top, width: imgW, height: imgH,
    poi: { id: p.id, label: p.label, x: left + imgW / 2, y: top + imgH / 2, w: imgW, h: imgH }
  };
}

const LAYOUT = PROPS.map(layoutProp);

   on the whole model shows a room with specks on the bench. Home is therefore

   still reachable — one number, moved from one place to another, not a new
   limit. HOME_FOCUS is the desk's mid point lifted 45 px so the window and the
