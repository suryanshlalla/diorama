/* ══════════════════════════════════════════════════════════════════════
   THE JELLY ENGINE, v3 — a deformation FIELD, not a free mesh.

   v2 was a verlet lattice; a lattice has enough degrees of freedom to fold
   its cells inside-out, and folded states are stable — the owner's crumpled
   "weird shapes" after hard drags. v3 removes the freedom to be wrong: the
   whole surface is an analytic function of ONE spring state P (the pull at
   the grab point). Every vertex moves by P weighted with a smooth gaussian
   falloff and a base anchor, so the surface is smooth by construction, folds
   cannot exist, release rings the spring (a real damped ~4.5 Hz jiggle with
   overshoot), and rest is EXACTLY the painted jelly. A small coupled squash
   term keeps the volume feel: stretch up narrows, squash down bulges.
   The rAF loop runs only while |P| or |V| is alive; rest costs nothing.
   ══════════════════════════════════════════════════════════════════════ */
function buildJelly(box, img) {
  const FLAV = ['berry', 'mint', 'honey'];
  const texs = FLAV.map(function (f) {
    const t = new Image(); t.src = 'assets/derived/jelly-' + f + '.png'; return t;
  });
  let flav = 0;

  const TW = 480, TH = 437, PADF = 0.4;
  const PX = TW * PADF, PY = TH * PADF;
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(TW * (1 + 2 * PADF));
  canvas.height = Math.round(TH * (1 + 2 * PADF));
  canvas.className = 'jelly-canvas';
  canvas.style.left = (-100 * PADF) + '%';
  canvas.style.top = (-100 * PADF) + '%';
  canvas.style.width = (100 * (1 + 2 * PADF)) + '%';
  canvas.style.height = (100 * (1 + 2 * PADF)) + '%';
  img.style.visibility = 'hidden';               // img still sizes the box
  box.appendChild(canvas);
  box.classList.add('prop--spinnable');
  box.setAttribute('role', 'button');
  box.setAttribute('tabindex', '0');
  box.setAttribute('aria-label', 'Play with the jelly');
  box.setAttribute('data-nodrag', '');
  const ctx = canvas.getContext('2d');

  const COLS = 8, ROWS = 6, N = (COLS + 1) * (ROWS + 1);
  const rx = new Float64Array(N), ry = new Float64Array(N);
  const px_ = new Float64Array(N), py_ = new Float64Array(N);
  for (let r = 0; r <= ROWS; r++) {
    for (let c = 0; c <= COLS; c++) {
      const i = r * (COLS + 1) + c;
      rx[i] = PX + TW * c / COLS; ry[i] = PY + TH * r / ROWS;
      px_[i] = rx[i]; py_[i] = ry[i];
    }
  }

  /* the one spring: P = pull at the grab point, V its velocity */
  const SIGMA = TW * 0.36, OMEGA = 28, ZETA = 0.13, STRETCH = TW * 0.52;
  let Px = 0, Py = 0, Vx = 0, Vy = 0;
  let hopY = 0, hopV = 0, lastTap = 0;           // the JUMP (double-tap)
  let gpx = PX + TW / 2, gpy = PY + TH * 0.35;   // grab point, rest space
  let grabbing = false, tgx = 0, tgy = 0;        // pointer target while held
  let running = false;

  function field() {
    const cx = PX + TW / 2;
    /* normalise so the point UNDER THE CURSOR follows it 1:1 — without this
       the falloff made the grab lag the hand (owner: "not following the
       cursor"). Neighbours still move less, the base stays seated. */
    const wg = Math.max(0.25, 1 - Math.pow((gpy - PY) / TH, 1.5));
    for (let i = 0; i < N; i++) {
      const dx = rx[i] - gpx, dy = ry[i] - gpy;
      const w = Math.min(1.15, Math.exp(-(dx * dx + dy * dy) / (2 * SIGMA * SIGMA)) *
                (1 - Math.pow((ry[i] - PY) / TH, 1.5)) / wg);
      px_[i] = rx[i] + Px * w
             - 0.22 * Py * w * (rx[i] - cx) / (TW / 2);   // squash couples
      py_[i] = ry[i] + Py * w - hopY * (1 - 0.3 * (ry[i] - PY) / TH);
    }
  }

  function stepSpring() {
    const dt = 1 / 60;
    if (grabbing) {
      Px += (tgx - Px) * 0.65; Py += (tgy - Py) * 0.65;
      Vx = (tgx - Px) * 8; Vy = (tgy - Py) * 8;
    } else {
      Vx += (-OMEGA * OMEGA * Px - 2 * ZETA * OMEGA * Vx) * dt;
      Vy += (-OMEGA * OMEGA * Py - 2 * ZETA * OMEGA * Vy) * dt;
      Px += Vx * dt; Py += Vy * dt;
    }
    /* the hop: ballistic, lands with a squash impulse */
    if (hopY > 0 || hopV !== 0) {
      hopV -= 3400 * dt;
      hopY += hopV * dt;
      if (hopY <= 0) {
        if (hopV < -150) { Vy += 260; SND.play('squish'); }   // landing squash
        hopY = 0; hopV = 0;
      }
    }
  }

  function tri(x0, y0, x1, y1, x2, y2, u0, v0, u1, v1, u2, v2, tex) {
    ctx.save();
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.closePath(); ctx.clip();
    const du1 = u1 - u0, dv1 = v1 - v0, du2 = u2 - u0, dv2 = v2 - v0;
    const det = du1 * dv2 - du2 * dv1 || 1e-6;
    const a = ((x1 - x0) * dv2 - (x2 - x0) * dv1) / det;
    const b = ((y1 - y0) * dv2 - (y2 - y0) * dv1) / det;
    const c = ((x2 - x0) * du1 - (x1 - x0) * du2) / det;
    const d = ((y2 - y0) * du1 - (y1 - y0) * du2) / det;
    ctx.transform(a, b, c, d, x0 - a * u0 - c * v0, y0 - b * u0 - d * v0);
    ctx.drawImage(tex, 0, 0);
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const tex = texs[flav];
    if (!tex.complete || !tex.naturalWidth) return;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const i = r * (COLS + 1) + c, j = i + 1, k2 = i + COLS + 1, l = k2 + 1;
        const u0 = (rx[i] - PX) * tex.naturalWidth / TW, v0 = (ry[i] - PY) * tex.naturalHeight / TH;
        const u1 = (rx[j] - PX) * tex.naturalWidth / TW, v1 = (ry[j] - PY) * tex.naturalHeight / TH;
        const u2 = (rx[k2] - PX) * tex.naturalWidth / TW, v2 = (ry[k2] - PY) * tex.naturalHeight / TH;
        const u3 = (rx[l] - PX) * tex.naturalWidth / TW, v3 = (ry[l] - PY) * tex.naturalHeight / TH;
        tri(px_[i], py_[i], px_[j], py_[j], px_[k2], py_[k2], u0, v0, u1 + 0.7, v1, u2, v2 + 0.7, tex);
        tri(px_[l], py_[l], px_[j], py_[j], px_[k2], py_[k2], u3, v3, u1 + 0.7, v1 - 0.7, u2 - 0.7, v2 + 0.7, tex);
      }
    }
  }

  function loop() {
    stepSpring(); field(); draw();
    if (grabbing || hopY > 0 || Math.hypot(Px, Py) > 0.3 || Math.hypot(Vx, Vy) > 6) {
      requestAnimationFrame(loop);
    } else {
      Px = Py = Vx = Vy = 0;
      field(); draw();
      running = false;
    }
  }
  function wake() { if (!running) { running = true; requestAnimationFrame(loop); } }

  function canvasPoint(e) {
    const rect = canvas.getBoundingClientRect();
    return [(e.clientX - rect.left) * canvas.width / rect.width,
            (e.clientY - rect.top) * canvas.height / rect.height];
  }
  function clampStretch(x, y) {
    const d = Math.hypot(x, y);
    return d > STRETCH ? [x * STRETCH / d, y * STRETCH / d] : [x, y];
  }
  function poke(x, y, kick) {
    if (reduceQuery.matches) return;
    gpx = Math.max(PX, Math.min(PX + TW, x));
    gpy = Math.max(PY, Math.min(PY + TH * 0.8, y));
    Vx += (Math.random() - 0.5) * 60; Vy -= kick;
    SND.play('squish');
    wake();
  }

  let downAt = null;
  canvas.addEventListener('pointerdown', function (e) {
    canvas.setPointerCapture(e.pointerId);
    const pt = canvasPoint(e);
    downAt = pt;
    if (!reduceQuery.matches) {
      gpx = Math.max(PX, Math.min(PX + TW, pt[0]));
      gpy = Math.max(PY, Math.min(PY + TH * 0.8, pt[1]));
      grabbing = true; tgx = 0; tgy = 0;
      wake();
    }
    e.preventDefault();
  });
  let lastMove = [0, 0, 0];                       // x, y, t — for the throw
  canvas.addEventListener('pointermove', function (e) {
    if (!grabbing) return;
    const pt = canvasPoint(e);
    lastMove = [pt[0], pt[1], performance.now()];
    const t = clampStretch(pt[0] - downAt[0], pt[1] - downAt[1]);
    tgx = t[0]; tgy = t[1];
  });
  function release(e) {
    if (downAt && e && Math.hypot(canvasPoint(e)[0] - downAt[0], canvasPoint(e)[1] - downAt[1]) < 9) {
      const now2 = performance.now();
      if (now2 - lastTap < 380 && !reduceQuery.matches) {
        if (hopY <= 0) {                            // grounded only: no stacking
          hopV = 620; hopY = 0.01;                  // double-tap: JUMP
          Vy -= 320;                                // anticipation stretch
          SND.play('squish');
        }
      } else {
        flav = (flav + 1) % FLAV.length;           // a tap: poke + next flavour
        poke(downAt[0], downAt[1], 220);
      }
      lastTap = now2;
    }
    /* a fast upward drag THROWS the jelly: it leaps once, grounded-gated */
    if (grabbing && hopY <= 0 && !reduceQuery.matches && tgy < -TW * 0.04) {
      hopV = Math.min(820, 300 - tgy * 3.6); hopY = 0.01;
      SND.play('squish');
    }
    grabbing = false; downAt = null; wake();
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', function () { grabbing = false; downAt = null; wake(); });
  /* stuck-guards: if capture is lost or the tab blurs mid-drag, let go */
  canvas.addEventListener('lostpointercapture', function () { grabbing = false; downAt = null; wake(); });
  window.addEventListener('blur', function () { grabbing = false; downAt = null; wake(); });
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      flav = (flav + 1) % FLAV.length;
      poke(PX + TW / 2, PY + TH / 3, 220);
    }
  });
  texs[0].addEventListener('load', function () { field(); draw(); });
  if (texs[0].complete) { field(); draw(); }     // cached textures never fire 'load'
}

/* ── windows ───────────────────────────────────────────────────────────
   MEASURED, not drawn by hand. From assets/room-without-desk.png:

     1. pane candidates = alpha > 128 AND (R − B) < 55 AND R > 150 AND G > 150.
        The frames are a distinctly warmer, darker wood — (192,124,63) against
        (252,250,246) glass — so that one test separates glass from frame
        cleanly, while glass and wall stay together.
     2. 4-connected flood from a seed inside each pane. The frame is continuous
        all the way round both openings, so the flood stops exactly at the
        wood: sidelight 30,024 px, main window 131,896 px.
     3. convex hull of the component, Douglas-Peucker at 2 px, then inset 1.5 px
        towards the centroid so the clip lands inside the frame rather than on
        it. Coverage of the fitted polygon against the flooded component:
        0.53% of the polygon falls outside the glass on the sidelight, 0.50% on
        the main window, and both of those are the inset band itself.
     4. The main window is split at its mullion, so the painted mullion
        survives instead of being buried under the tree. The mullion was fitted
        from the pixels the pane test rejects inside the opening:
            x = −0.066224·y + 796.279,  sd 0.17 px
        and each pane is held 1.2 px clear of it.

   Percentages are of the 1306 x 1205 world box. */
const TREE_Z = -450;                  // s = 0.800; see PERSPECTIVE above
const CORRIDOR_Z = -80;               // just beyond the door wall: barely-there parallax

/* kind 'tree' panes look at the cherry tree. The SIDELIGHT is an INTERIOR
   pane: in the approved art it looks into the office corridor — plank floor,
   round white table, potted plant — which is also where the door leads.
   Giving it the tree had the room looking outdoors through its own inside
   wall (audit, tree-art lens; corridor-pane.png is the commissioned view). */
const WINDOWS = [
  { id: 'sidelight', kind: 'corridor',
    poly: [[33.989, 17.718], [34.296, 17.884], [34.372, 18.880], [36.202, 50.332],
           [35.743, 50.913], [31.256, 53.237], [28.453, 19.701]] },
  { id: 'window-l', kind: 'tree',
    poly: [[48.155, 16.946], [54.242, 15.477], [59.778, 18.019], [57.615, 53.417], [48.009, 45.801]] },
  { id: 'window-r', kind: 'tree',
    poly: [[59.957, 18.101], [73.254, 24.207], [68.492, 62.041], [57.790, 53.556]] }
];

/* ── the tree, COMPOSED ────────────────────────────────────────────────
   The old single-raster tree is gone: its blossoms measured ~4x life size,
   its sky was unpainted paper-white, and one flat bitmap can only ever move
   as one rigid thing — the exact motion the owner rejected. In its place,
   real pieces, generated separately and each cut out with true alpha:
   a far blossom haze for depth, the trunk with its bare limbs, and five
   blossom branches, each hinged at the measured point where its bough runs
   off its own frame.

   COVERAGE IS NOW STRUCTURAL, NOT PROVED. The slot's own background is a
   painted lavender sky filling the entire aperture, so the wall can never
   show through regardless of where any branch moves. The old exhaustive
   123,984-pose cover sweep and the 22 px sway budget existed only because
   the single opaque raster was the last line of defence; they are obsolete
   and deleted. Branch amplitude is an aesthetic choice now, not a safety
   bound. */
const CORRIDOR = { src: 'corridor-pane.png', w: 853, h: 1844 };

/* ONE square canvas shared by the two TREE panes. They look at the same tree
   across the painted mullion, so they must be given the same canvas at the
   same place or the canopy would break at the divide. Sized to the panes'
   joint bbox plus the exact parallax bound (the layer offset is (1 − s)·c,
   |c| ≤ half the world box) plus a seam — generous rather than proved,
   because the sky backstop now carries the guarantee. */
const TREE_BOX = (function () {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  WINDOWS.filter((w) => w.kind === 'tree').forEach(function (w) {
    w.poly.forEach(function (p) {
      if (p[0] < x0) x0 = p[0];
      if (p[0] > x1) x1 = p[0];
      if (p[1] < y0) y0 = p[1];
      if (p[1] > y1) y1 = p[1];
    });
  });
  const bx = x0 / 100 * WORLD.w, bw = (x1 - x0) / 100 * WORLD.w;
  const by = y0 / 100 * WORLD.h, bh = (y1 - y0) / 100 * WORLD.h;
  const f = Math.abs(1 - depthFactor(TREE_Z, PERSPECTIVE));
  const mx = f * WORLD.w / 2 + 24;
  const my = f * WORLD.h / 2 + 24;
  const side = Math.max(bw + 2 * mx, bh + 2 * my);
  return { left: bx + bw / 2 - side / 2, top: by + bh / 2 - side / 2, side: side };
})();

/* The composition. Each layer: src under assets/ (real alpha cut-outs), its
   natural w/h, box {x, y, wf} as fractions of the square canvas (height
   follows from the aspect ratio), transform-origin at the measured HINGE —
   the midpoint of the opaque run along the frame edge the bough exits
   through, read off each PNG's own alpha channel — amp as a fraction of
   WIND_THETA_MAX, and lag in seconds.

   The motion design: the trunk barely moves, big boughs follow, small and
   hanging branches move most, and the lags stagger each gust's arrival so
   the wind visibly TRAVELS through the canopy instead of the whole tree
   swinging in lockstep — which was the owner's exact complaint. */
/* Rows with H/T are BOUGHS and bend (research/branch-bend.md): H is the hinge
   — midpoint of the opaque run along the edge the bough exits — and T is the
   tip, the centroid of the farthest 6% radial band of opaque pixels from H,
   both in the PNG's own pixels. `dir` makes every tip move screen-right on a
   gust (kills the see-saw of mixed signs). Rows without H/T are single rigid
   layers: the far haze drifts, the trunk barely moves (SpeedTree's "shared"
   tier, which "almost never" gets branch motion). */
const TREE_LAYERS = [
  { src: 'blossom-far.png',       w: 1254, h: 1254, x: 0.00, y: 0.00, wf: 1.00, origin: '50% 120%', amp: 0.10, lag: 0.45, drift: true },
  { src: 'tree-trunk.png',        w: 1254, h: 1254, x: 0.20, y: 0.42, wf: 0.66, origin: '50% 100%', amp: 0.25, lag: 0.00 },
  { src: 'branch-left.png',       w: 1386, h: 910,  x: 0.00, y: 0.28, wf: 0.60, H: [0, 742],     T: [1327, 264],  amp: 1.00, lag: 0.10, dir: +1 },
  { src: 'branch-right.png',      w: 1353, h: 824,  x: 0.42, y: 0.40, wf: 0.58, H: [1353, 339],  T: [55, 414],    amp: 0.95, lag: 0.16, dir: -1 },
  { src: 'branch-topleft.png',    w: 1165, h: 1259, x: 0.06, y: 0.00, wf: 0.40, H: [0, 20],      T: [871, 1160],  amp: 1.10, lag: 0.22, dir: -1 },
  { src: 'branch-topright.png',   w: 1112, h: 1268, x: 0.55, y: 0.02, wf: 0.40, H: [1112, 16],   T: [112, 1170],  amp: 1.05, lag: 0.27, dir: -1 },
  { src: 'branch-bottomleft.png', w: 1287, h: 1198, x: 0.00, y: 0.58, wf: 0.44, H: [0, 990],     T: [1120, 197],  amp: 0.90, lag: 0.13, dir: +1 }
];

/* natural-motion.md §2.7 quoted THETA_MAX = 1.10° against a 567 px plate.
   Each branch here is roughly that plate's size in canvas terms, and with the
   sky as backstop the angle is aesthetic rather than a safety bound, so the
   report's number is used directly. Frequencies, amplitude split, golden-angle
   phases and the gust envelope are §2.7 verbatim below. */
/* Interim: 0.55° until the bend model lands. The owner judged 1.10° on a
   rigid bough as "moving too much" — correct, because a rigid rotation moves
   the whole bough by the tip angle, whereas a real bough only reaches that
   angle AT the tip. The proper fix is bending (research/branch-bend.md);
   this halves the excursion in the meantime. */
const WIND_THETA_MAX = 0.55;

const treeLayers = [];        // rigid layers: { el, amp, lag, drift }, in every tree pane
const boughs = [];            // bending boughs: { segs, branch, angles }, in every tree pane

/* ══════════════════════════════════════════════════════════════════════
   BOUGH BENDING — research/branch-bend.md §6.1, verbatim.

   Bend profile: Habel, Kusternig & Wimmer 2009 eq.(7), tapered cantilever
   u(x) = c2·x² + c4·x⁴ with taper α = 0.2 (their Table 1). Normalised so the
   tip is 1. Chain weights are the second differences of that curve, so the
   polyline passes through it at every seam and Σ w_i(1 − s_i) = 1 exactly:
   TIP_DEG·amp IS the tip chord angle, and a hard ceiling because |sway| ≤ 1.
   Sub-branch lag (tier B) is a per-segment time delay linear along the bough;
   flutter (tier C) is a small fast rotation on the outer segments only, at
   1.975 Hz — Unity/Crysis' shipped edge-flutter constant — plus a φ-spaced
   second term. Numbers marked "judgement" in the report are just that.
   ══════════════════════════════════════════════════════════════════════ */
const BEND = {
  C2: 0.374571, C4: 0.129428,        // Habel 2009, α = 0.2
  TIP_DEG: 0.80,                     // tip CHORD ceiling → tip δ/L = 1.40% at the rare coincident peak
  TAU_TIP: 0.25,                     // s; tip lags hinge (whip), linear in s — judgement
  /* 5 segments, not 8. The bend curve is a smooth quadratic-ish, so 5 chords
     track it to well under a pixel, and each segment costs a composited layer
     holding a scaled copy of a ~1.3 MP image. At 8 the scene carried 120 such
     layers across three panes and re-rasterised all of them during a zoom,
     which is what made panning lag and flicker. 5 puts it at 75, and only the
     visible scene's are stepped. */
  N: 5, OVERLAP: 10,                 // segments per bough; px each strip runs past its seam
  FLUT: { F: [1.975, 1.975 * 1.6180339887498949], AMP: [0.618034, 0.381966],
          DEG: 0.18, S0: 0.5, FLOOR: 0.6 }
};
function uHat(s) { return (BEND.C2 * s * s + BEND.C4 * s ** 4) / (BEND.C2 + BEND.C4); }
function segmentWeights(N) {
  const w = new Array(N); let prev = 0;
  for (let i = 0; i < N; i++) { const m = N * (uHat((i + 1) / N) - uHat(i / N)); w[i] = m - prev; prev = m; }
  return w;
}
/** Unit sway in [-1, 1]: natural-motion.md §2.7's three-mode sum under the gust. */
function swayUnit(t) {
  return windGust(t) * (
      WIND.AMP[0] * Math.sin(TAU * WIND.F[0] * t + WIND.PHS[0])
    + WIND.AMP[1] * Math.sin(TAU * WIND.F[1] * t + WIND.PHS[1])
    + WIND.AMP[2] * Math.sin(TAU * WIND.F[2] * t + WIND.PHS[2]));
}
function flutterRad(t, i, N) {
  const s = i / N, F = BEND.FLUT;
  if (s < F.S0) return 0;
  const wc = ((s - F.S0) / (1 - F.S0)) ** 2;
  const env = F.FLOOR + (1 - F.FLOOR) * windGust(t);
  const psi = i * GOLDEN_ANGLE;
  const f = F.AMP[0] * Math.sin(TAU * F.F[0] * t + psi) + F.AMP[1] * Math.sin(TAU * F.F[1] * t + psi * 2);
  return F.DEG * Math.PI / 180 * wc * env * f;
}
/** Relative rotation, degrees, of every segment of one bough at t. Pure. */
function segmentAnglesDeg(t, b, out) {
  const N = b.N, tipRad = BEND.TIP_DEG * Math.PI / 180 * b.amp * b.dir;
  for (let i = 0; i < N; i++) {
    const s = i / N, tt = t - b.lag - BEND.TAU_TIP * s;
    out[i] = (tipRad * b.w[i] * swayUnit(tt) + b.dir * flutterRad(t - b.lag, i, N)) * 180 / Math.PI;
  }
  return out;
}

/** Build one bough as a nested chain of N segments inside `host`, in the same
    percentage box the rigid <img> would have used. research/branch-bend.md §6.2. */
function buildBough(host, L, box) {
  const N = BEND.N, ov = BEND.OVERLAP;
  const root = document.createElement('div');
  root.className = 'bough';
  root.style.left = box.left; root.style.top = box.top; root.style.width = box.width;
  root.style.aspectRatio = L.w + '/' + L.h;

  const ux = L.T[0] - L.H[0], uy = L.T[1] - L.H[1];
  const domX = Math.abs(ux) >= Math.abs(uy);            // slice along the dominant image axis
  const segs = [];
  let parent = root;
  for (let i = 0; i < N; i++) {
    const s0 = i / N, s1 = (i + 1) / N;
    const seg = document.createElement('div');
    seg.className = 'seg';
    seg.style.transformOrigin = (100 * (L.H[0] + ux * s0) / L.w).toFixed(4) + '% ' +
                                (100 * (L.H[1] + uy * s0) / L.h).toFixed(4) + '%';
    const c0 = domX ? L.H[0] + ux * s0 : L.H[1] + uy * s0;
    const c1 = domX ? L.H[0] + ux * s1 : L.H[1] + uy * s1;
    let lo = Math.min(c0, c1) - ov, hi = Math.max(c0, c1) + ov;
    const full = domX ? L.w : L.h, along = domX ? ux : uy;
    if (i === 0 && along > 0) lo = 0;                    // hinge end runs to the image edge
    if (i === 0 && along < 0) hi = full;
    if (i === N - 1 && along > 0) hi = full;             // tip end runs to the image edge
    if (i === N - 1 && along < 0) lo = 0;
    lo = Math.max(0, lo); hi = Math.min(full, hi);
    const len = hi - lo;

    const strip = document.createElement('div');
    strip.className = 'strip';
    if (domX) { strip.style.left = (100 * lo / L.w).toFixed(4) + '%'; strip.style.width = (100 * len / L.w).toFixed(4) + '%'; strip.style.top = '0'; strip.style.height = '100%'; }
    else      { strip.style.top = (100 * lo / L.h).toFixed(4) + '%'; strip.style.height = (100 * len / L.h).toFixed(4) + '%'; strip.style.left = '0'; strip.style.width = '100%'; }
    const img = document.createElement('img');
    img.src = 'assets/' + L.src; img.alt = ''; img.draggable = false;
    img.width = L.w; img.height = L.h;
    // The img spans the whole bough and is shifted so this strip's window shows
    // its own band. Width in % of the strip (definite); shift in % of the img's
    // OWN box, so nothing leans on a percentage height inside an aspect-ratio box.
    if (domX) { img.style.width = (100 * L.w / len).toFixed(4) + '%'; img.style.transform = 'translateX(' + (-100 * lo / L.w).toFixed(4) + '%)'; }
    else      { img.style.width = '100%';                                img.style.transform = 'translateY(' + (-100 * lo / L.h).toFixed(4) + '%)'; }
    strip.appendChild(img);
    seg.appendChild(strip);
    parent.appendChild(seg);
    parent = seg;                                        // the next segment rides on this one
    segs.push(seg);
  }
  host.appendChild(root);
  boughs.push({
    segs: segs, scene: currentBuildScene,
    branch: { amp: L.amp, lag: L.lag, dir: L.dir, N: N, w: segmentWeights(N) },
    angles: new Array(N)
  });
}

/* Which scene the layers being built belong to, so stepWind can skip the ones
   that are not on screen. Set around each builder. */
let currentBuildScene = 'room';

/** Place one TREE_LAYERS row into a host, in a canvas of `side` px at (left,top),
    with positions expressed as % of a (fw x fh) frame. Boughs bend; others are
    rigid <img> layers driven by treeLayerTransform. */
function placeTreeLayer(host, L, left, top, side, fw, fh) {
  const box = {
    left: (100 * (left + L.x * side) / fw).toFixed(4) + '%',
    top: (100 * (top + L.y * side) / fh).toFixed(4) + '%',
    width: (100 * L.wf * side / fw).toFixed(4) + '%'
  };
  if (L.H) { buildBough(host, L, box); return; }
  const img = document.createElement('img');
  img.className = 'tree-layer';
  img.src = 'assets/' + L.src; img.alt = ''; img.draggable = false;
  img.width = L.w; img.height = L.h;
  img.style.left = box.left; img.style.top = box.top; img.style.width = box.width;
  img.style.transformOrigin = L.origin;
  host.appendChild(img);
  treeLayers.push({ el: img, amp: L.amp, lag: L.lag, drift: !!L.drift, scene: currentBuildScene });
}

/** Axis-aligned bbox of a pane polygon, in stage px. Pure. */
function paneBox(poly) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  poly.forEach(function (p) {
    if (p[0] < x0) x0 = p[0];
    if (p[0] > x1) x1 = p[0];
    if (p[1] < y0) y0 = p[1];
    if (p[1] > y1) y1 = p[1];
  });
  return { x: x0 / 100 * WORLD.w, y: y0 / 100 * WORLD.h,
           w: (x1 - x0) / 100 * WORLD.w, h: (y1 - y0) / 100 * WORLD.h };
}

function buildWindows() {
  const frag = document.createDocumentFragment();
  WINDOWS.forEach(function (w) {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.style.clipPath = 'polygon(' + w.poly.map((p) => p[0] + '% ' + p[1] + '%').join(', ') + ')';

    const depth = document.createElement('div');
    depth.className = 'depth';

    if (w.kind === 'corridor') {
      /* The interior pane. Height-fits the corridor art over the pane's bbox
         plus its own (small) parallax margin; the art is far wider than this
         narrow pane needs, so cover is comfortable. Static: corridors do not
         sway. */
      depth.dataset.z = CORRIDOR_Z;
      const b = paneBox(w.poly);
      const f = Math.abs(1 - depthFactor(CORRIDOR_Z, PERSPECTIVE));
      const my = f * WORLD.h / 2 + 8;
      const ih = b.h + 2 * my;
      const iw = ih * CORRIDOR.w / CORRIDOR.h;
      const img = document.createElement('img');
      img.className = 'art';
      img.src = 'assets/' + CORRIDOR.src;
      img.alt = '';
      img.width = CORRIDOR.w; img.height = CORRIDOR.h;
      img.draggable = false;
      img.style.left = (100 * (b.x + b.w / 2 - iw / 2) / WORLD.w).toFixed(4) + '%';
      img.style.top = (100 * (b.y - my) / WORLD.h).toFixed(4) + '%';
      img.style.width = (100 * iw / WORLD.w).toFixed(4) + '%';
      depth.appendChild(img);
    } else {
      /* A tree pane. The painted sky IS the backstop: it fills the aperture
         at the slot level, so no motion of any layer can ever expose the
         wall. Colour anchored on the reference art's lavender (#DEBAD0). */
      slot.style.background =
        'linear-gradient(180deg, #d6c2e6 0%, #debad0 52%, #eecad7 100%)';
      depth.dataset.z = TREE_Z;
      TREE_LAYERS.forEach(function (L) {
        placeTreeLayer(depth, L, TREE_BOX.left, TREE_BOX.top, TREE_BOX.side, WORLD.w, WORLD.h);
      });
    }

    // A pane of glass over the lot, so the view and the plate's own painted
    // glazing sit behind the same warm cast instead of looking pasted into a
    // hole. Inside the clip, so it cannot touch the wall.
    const glaze = document.createElement('div');
    glaze.className = 'glaze';

    slot.appendChild(depth);
    slot.appendChild(glaze);
    frag.appendChild(slot);
  });
  document.getElementById('windows').appendChild(frag);
}

/* The entry scene's window gets the SAME tree stack, so the branches sway
   before the visitor ever opens the door — the owner called the still tree
   there out specifically. Percentages are of the 1354 x 1161 entry frame.
   The canvas is a square generously larger than the aperture bbox (68.24%..
   83.97% x 15.94%..80.02%), centred on it, so no branch edge can reach the
   clip; the sky backstop covers the rest. */
function buildEntryWindow() {
  const host = document.getElementById('entryWindow');
  const bx = 68.24, bw = 83.97 - 68.24, by = 15.94, bh = 80.02 - 15.94;   // % of frame
  const FW = 1354, FH = 1161;
  const bwPx = bw / 100 * FW, bhPx = bh / 100 * FH;
  /* This pane is tall and narrow (bbox 213 x 745 frame px), so a canvas sized
     to its height shows only a thin vertical slice — and centred, that slice
     is mostly trunk. Two biases: make the canvas a little wider than tall so
     more crown falls inside the pane, and push it up so the trunk enters from
     below and the blossom fills the upper pane, as the approved art frames it. */
  const side = Math.max(bwPx, bhPx) * 1.55;                                 // px of frame
  /* Place the canvas so the pane samples canvas x 0.28..0.46 (the left-centre
     blossom mass) and y 0.05..0.70 (crown down to where the trunk just enters):
     computed, not nudged — pane top at canvas 0.05, pane left at canvas 0.28. */
  const left = (bx / 100 * FW) - 0.28 * side;
  const top = (by / 100 * FH) - 0.05 * side;
  currentBuildScene = 'door';
  TREE_LAYERS.forEach(function (L) { placeTreeLayer(host, L, left, top, side, FW, FH); });
  currentBuildScene = 'room';
}

/* ══════════════════════════════════════════════════════════════════════
   WIND — natural-motion.md §2.7, verbatim.

   Three canopy modes at incommensurate frequencies (f1 is the measured
   whole-tree fundamental of an 18.6 m Scots pine; f2 and f3 are spaced by the
   golden ratio so the sum has no short almost-period), under a slow squared
   gust envelope, with a small non-uniform squash. THETA_MAX is a hard ceiling
   because the amplitudes are normalised to sum to 1, which is what makes the
   clip-edge bound below provable rather than hopeful.

   It is a pure function of elapsed time: no state, no integration, nothing to
   accumulate. That is what makes it bit-identical at 60/90/120/144 Hz and what
   makes a dropped frame or a backgrounded tab cost exactly nothing.
   ══════════════════════════════════════════════════════════════════════ */
const TAU = Math.PI * 2;
const GOLDEN_ANGLE = 2.399963229728653;
const WIND = {
  F: [0.260000, 0.420689, 0.680689],                        // Hz
  AMP: [0.500000, 0.309017, 0.190983],                      // sums to 1
  PHS: [0, GOLDEN_ANGLE, 2 * GOLDEN_ANGLE],
  T_G1: 22.0,
  T_G2: 22.0 / 1.6180339887498949,                          // 13.5967 s
  E_MIN: 0.24,
  THETA_MAX: WIND_THETA_MAX,                                // a hard ceiling; RMS is 0.228 of it
  SQUASH: 0.004
};

function windGust(t) {
  const raw = 0.62 * Math.sin(TAU * t / WIND.T_G1) + 0.38 * Math.sin(TAU * t / WIND.T_G2 + 2.4);
  const g = 0.5 + 0.5 * raw;
  return WIND.E_MIN + (1 - WIND.E_MIN) * g * g;
}

/** Sway angle in degrees at t seconds. Pure. */
function windSwayDeg(t) {
  return WIND.THETA_MAX * windGust(t) * (
      WIND.AMP[0] * Math.sin(TAU * WIND.F[0] * t + WIND.PHS[0])
    + WIND.AMP[1] * Math.sin(TAU * WIND.F[1] * t + WIND.PHS[1])
    + WIND.AMP[2] * Math.sin(TAU * WIND.F[2] * t + WIND.PHS[2]));
}

/** The transform for one tree layer at t seconds. Pure.
    Branches rotate about their own hinge with their own amplitude; the far
    haze does not rotate at all — it breathes sideways very slowly, the way a
    distant mass reads through glass. The per-layer lag means each gust
    arrives at the trunk first and reaches the outer branches a beat later. */
function treeLayerTransform(L, t) {
  const tt = t - L.lag;
  if (L.drift) {
    const dx = 4 * windGust(tt) * Math.sin(TAU * 0.05 * tt);
    return 'translateX(' + dx.toFixed(2) + 'px)';
  }
  const th = windSwayDeg(tt) * L.amp;
  const r = th / WIND.THETA_MAX;
  return 'rotate(' + th.toFixed(4) + 'deg) scaleX(' + (1 - WIND.SQUASH * r * r).toFixed(5) + ')';
}

let windT0 = null;
let windFreezeT = null;                 // set by ?wind=<s> for still-frame verification
let windFrameParity = 0;
function stepWind(now) {
  if ((windFrameParity = 1 - windFrameParity)) return;   // 30 Hz is plenty for a breeze
  if (reduceQuery.matches) return;
  if (windT0 === null) windT0 = now;
  const t = windFreezeT !== null ? windFreezeT : (now - windT0) / 1000;
  /* Only the scene on screen. Writing transforms to the hidden scene's layers
     doubled the per-frame work for nothing, and every one of those writes
     dirties a composited layer the compositor then has to consider. */
  const live = sceneIsRoom ? 'room' : 'door';
  for (let i = 0; i < treeLayers.length; i++) {
    const L = treeLayers[i];
    if (L.scene !== live) continue;
    L.el.style.transform = treeLayerTransform(L, t);
  }
  for (let k = 0; k < boughs.length; k++) {
    const b = boughs[k];
    if (b.scene !== live) continue;
    segmentAnglesDeg(t, b.branch, b.angles);
    for (let i = 0; i < b.branch.N; i++) b.segs[i].style.transform = 'rotate(' + b.angles[i].toFixed(4) + 'deg)';
  }
}

/* ── the desk plate ────────────────────────────────────────────────────
   Built rather than written into the markup so the fitted numbers in DESK
   drive the layer and the scale system from one place. */
let deskBox = null;                   // the desk plate box; the live layer mounts here
function buildDesk() {
  const d = document.createElement('div');
  d.className = 'depth';
  d.dataset.z = DESK.z;
  d.style.inset = 'auto';
  d.style.left = (100 * DESK.fitX / WORLD.w).toFixed(4) + '%';
  d.style.top = (100 * DESK.fitY / WORLD.h).toFixed(4) + '%';
  d.style.width = (100 * DESK.w * SRC_TO_STAGE / WORLD.w).toFixed(4) + '%';
  d.style.aspectRatio = DESK.w + '/' + DESK.h;

  const img = document.createElement('img');
  img.className = 'art';
  img.src = DESK.src;
  img.alt = '';
  img.width = DESK.w; img.height = DESK.h;
  img.draggable = false;
  img.style.left = '0'; img.style.top = '0'; img.style.width = '100%';
  d.appendChild(img);
  document.getElementById('desk').appendChild(d);
  deskBox = d;                        // hands, lamp zone and glow mount here
}

/* ── the objects ───────────────────────────────────────────────────────
   One .depth per prop, in depth order so paint order matches the room, and
   within a depth in table order so the left-to-right run along the bench also
   sets who overlaps whom.

   THE CONTACT SHADOW IS DRAWN HERE, NOT BAKED IN. Every asset arrived with a
   soft shadow painted on white; the cut-out kept it as an OPAQUE pale-grey
   smear, which over wood or carpet reads as a white smudge — the opposite of a
   shadow. tools/prepare-assets.py deletes it from the objects on the desktop
   and this draws a real one underneath, which is what lets a hover lift the
   object and grow its shadow at the same time. The fixtures that never lift —
   the desk, the chair, the door leaf — keep the artist's own shadow instead,
   converted to honest alpha: black at alpha 1 − L/255 reproduces multiplying
   the backdrop by L/255 EXACTLY, for any backdrop, which no CSS shadow could
   do for a cast shadow with real floor geometry. Measured against the original
   one-piece plate, per-channel RMS over the desk's shadow: 149.8 with the raw
   asset, 62.5 with no shadow at all, 48.3 converted. */
function buildProps() {
  const byDepth = {};
  LAYOUT.forEach(function (l) {
    (byDepth[l.prop.z] || (byDepth[l.prop.z] = [])).push(l);
  });
  const frag = document.createDocumentFragment();
  Object.keys(byDepth).map(Number).sort((a, b) => a - b).forEach(function (z) {
    const d = document.createElement('div');
    d.className = 'depth';
    d.dataset.z = z;
    byDepth[z].forEach(function (l) {
      const p = l.prop;
      const box = document.createElement('div');
      box.className = 'prop';
      box.style.left = (100 * l.left / WORLD.w).toFixed(4) + '%';
      box.style.top = (100 * l.top / WORLD.h).toFixed(4) + '%';
      box.style.width = (100 * l.width / WORLD.w).toFixed(4) + '%';
      box.style.aspectRatio = p.w + '/' + p.h;

      if (p.shadow) {
        // an ellipse on the object's own footprint, in stage px so it scales
        // with the zoom exactly as the object does. shadow[3] lifts it off the
        // image's bottom edge, because a laptop's footprint centre is well
        // inside its silhouette while a mug's is right at the base.
        const sw = p.shadow[0] * l.width;
        const sh = p.shadow[1] * sw;
        box.style.setProperty('--sh-blur', p.shadow[2] + 'px');
        box.style.setProperty('--sh-w', sw.toFixed(2) + 'px');
        box.style.setProperty('--sh-h', sh.toFixed(2) + 'px');
        box.style.setProperty('--sh-y', (p.shadow[3] * l.height).toFixed(2) + 'px');
      } else {
        box.classList.add('prop--noshadow');
      }
      if (p.lift === false) box.classList.add('prop--fixed');

      const img = document.createElement('img');
      img.className = 'prop__img';
      img.src = 'assets/derived/' + p.src;
      img.alt = '';
      img.width = p.w; img.height = p.h;
      img.draggable = false;
      box.appendChild(img);

      /* Spinnable props are real controls, not divs with a click handler:
         focusable, Enter/Space operable, and announced. The animation is
         driven by adding a class and removed on animationend, so a second
         click cannot stack two animations or leave one stuck. */
      if (p.spin) {
        box.classList.add('prop--spinnable');
        box.setAttribute('role', 'button');
        box.setAttribute('tabindex', '0');
        box.setAttribute('aria-label', 'Spin the chair');
        box.setAttribute('data-nodrag', '');
        /* A REAL turn now: 12 frames sliced and normalised from the owner's
           turnaround sheet (tools note in DECISIONS §21), played once around
           with an ease — not the old scaleX squash, which read as the chair
           mirroring itself (owner, 2026-09-06). Ends on frame 0 (back-left,
           the rest pose's neighbour) and swaps the painted chair back in. */
        const spin = function () {
          if (box.classList.contains('prop--spin')) return;   // already turning
          if (reduceQuery.matches) return;                    // §6.6: involuntary motion only
          SND.play('chair');
          box.classList.add('prop--spin');
          /* CEL animation (owner, after the crossfade ghosted two frames
             into each other): Ghibli animates on twos with CRISP frames, so
             the spin is discrete frames on an eased clock — fast enough at
             the start that 12 angles read as motion, slowing into the last
             quarter turn. No blending, no ghosts. Ends beside the rest pose
             and hands back to the painted chair with a tiny settle rock. */
          const bh = box.clientHeight, fw = bh * 324 / 448;
          const mkOv = function () {
            const o = document.createElement('div');
            o.className = 'chair-spin';
            o.style.width = fw + 'px';
            o.style.height = bh + 'px';
            o.style.left = ((box.clientWidth - fw) / 2) + 'px';
            o.style.backgroundSize = (fw * 41) + 'px ' + bh + 'px';
            box.appendChild(o);
            return o;
          };
          const ov = mkOv(), ovB = mkOv();
          img.style.visibility = 'hidden';
          /* cartoon timing: constant FAST rotation (frames at ~75 ms read
             as motion, not slides), only the last two frames get brief
             holds, then the settle rock. Long eased tails made each late
             frame hold 300+ ms — the owner's "zero smoothness". */
          /* v4: a full revolution of mismatched AI frames flickers no
             matter the timing. A real person in a small room NUDGES the
             chair: it swivels out a quarter turn and swings back. Only the
             four adjacent back-view frames are used — they share style, so
             nothing flickers — on a sine pendulum. */
          /* v6: 41 white-keyed frames of the video's REAL rotation (a seek
             race had been duplicating the first frames — the "tiny arc" was
             an extraction bug, not Sora). Sub-frame CROSSFADE between
             adjacent frames: with temporally consistent frames blending is
             ghost-free, so the sweep is as smooth as playing the video. */
          const t0 = performance.now(), DUR = 3000;
          (function stepSpin(now) {
            const u = Math.min(1, (now - t0) / DUR);
            const x = 40 * Math.sin(u * Math.PI);
            const f = Math.min(39, Math.floor(x)), frac = x - Math.floor(x);
            ov.style.backgroundPosition = (-f * fw) + 'px 0';
            ovB.style.backgroundPosition = (-Math.min(40, f + 1) * fw) + 'px 0';
            ovB.style.opacity = frac.toFixed(3);
            if (u < 1) { requestAnimationFrame(stepSpin); return; }
            ov.remove(); ovB.remove();
            img.style.visibility = '';
            img.style.transformOrigin = '50% 92%';
            const r0 = performance.now();
            (function rock(n2) {
              const v = Math.min(1, (n2 - r0) / 650);
              img.style.transform = 'rotate(' + (2.2 * Math.sin(v * Math.PI * 3) * (1 - v)).toFixed(2) + 'deg)';
              if (v < 1) requestAnimationFrame(rock);
              else { img.style.transform = ''; box.classList.remove('prop--spin'); }
            })(r0);
          })(t0);
        };
        box.addEventListener('click', spin);
        box.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); spin(); }
        });
        img.addEventListener('animationend', function () { box.classList.remove('prop--spin'); });
      }

      if (p.jelly) buildJelly(box, img);

      d.appendChild(box);
    });
    frag.appendChild(d);
  });
  document.getElementById('props').appendChild(frag);
}

buildDesk();
buildWindows();
buildEntryWindow();
buildProps();

const depthGroups = Array.prototype.map.call(
  el.stage.querySelectorAll('.depth'),
  (node) => ({ el: node, s: depthFactor(parseFloat(node.dataset.z), PERSPECTIVE), last: '' })
);

const reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
const camera = createCamera({ world: WORLD, pois: POIS });
const cam = camera.cam;

/* Composition tells the camera where home is. The pull-back allowance now
   stops AT the whole-model fit: the extra 1.3x used to let the view pull
   wider than the plates' painted bleed can cover, and the composition
   visibly came apart there — seams, the sky backstop above the window, the
   desk on bare white (owner's screenshot, 2026-09-04). The push-in allowance
   shrinks by HOME_BOOST, so the maximum raster scale — and therefore the
   memory budget of §3.1 — is unchanged at 4.2x the whole-room fit. */
camera.cfg.homeBoost = HOME_BOOST;
camera.cfg.homeFocus = HOME_FOCUS;
camera.cfg.zOutLog = Math.log(HOME_BOOST);
camera.cfg.zInLog = Math.log(4.2 / HOME_BOOST);

let rect = { left: 0, top: 0 };       // §2.1 — cached; never measured inside a handler

function measure() {
  const r = el.viewport.getBoundingClientRect();
  rect = { left: r.left, top: r.top };
  camera.setViewport(r.width || window.innerWidth, r.height || window.innerHeight);
}

/* ══════════════════════════════════════════════════════════════════════
   §6  RENDERER — one transform per composited node, plus the raster hint.

       §3.3: will-change: transform pins the compositor's raster scale
       (kMinScaleRatioForWillChangeTransform = 0.25f in picture_layer_impl.cc),
       which is exactly why zoomed content goes soft when it is left on. ON at
       gesture start, OFF ~180 ms after the motion settles.
   ══════════════════════════════════════════════════════════════════════ */
/* 180 ms was too eager: every zoom-pause-zoom rhythm demoted and re-promoted
   the stage, and each cycle re-rasters AND re-decodes the plates (measured:
   ~150 ms of ImageDecodeTask per handback at DPR 2 — the decoded-image cache
   does not survive the demotion). At 500 ms a thinking pause keeps the layer;
   sharpness still lands well under a second after the visitor truly stops. */
const RASTER_HANDBACK_MS = 500;
let rasterOn = false;
let lastMotion = 0;
let lastStageTransform = '';

function markMoving(now) {
  lastMotion = now;
  if (rasterOn) return;
  rasterOn = true;
  el.stage.style.willChange = 'transform';
}

function maybeHandBackRaster(now) {
  if (!rasterOn || camera.isBusy(now) || now - lastMotion < RASTER_HANDBACK_MS) return;
  rasterOn = false;
  el.stage.style.willChange = 'auto';               // cc re-rasters at the ideal scale
  // Settle is the only safe moment to write the variable the hotspot min-size
  // depends on: nobody clicks mid-gesture. §6.5(c)
  el.stage.style.setProperty('--k-settled', Math.exp(cam.z).toFixed(4));
}

const drift = { x: 0, y: 0, tx: 0, ty: 0 };
el.viewport.addEventListener('pointermove', function (e) {
  if (!sceneIsRoom) return;
  drift.tx = ((e.clientX / window.innerWidth) - 0.5) * 22;
  drift.ty = ((e.clientY / window.innerHeight) - 0.5) * 15;
}, { passive: true });

function render(now) {
  drift.x += (drift.tx - drift.x) * 0.075;
  drift.y += (drift.ty - drift.y) * 0.075;
  const k = Math.exp(cam.z);
  const t = 'translate3d(' + (cam.x + drift.x).toFixed(2) + 'px,' + (cam.y + drift.y).toFixed(2) + 'px,0) scale(' + k.toFixed(5) + ')';
  if (t !== lastStageTransform) {
    lastStageTransform = t;
    el.stage.style.transform = t;                   // ONE write, ONE composited node
    markMoving(now);
  }

  /* Per-layer parallax. §4.1: for flat planes at fixed depth the CSS
     perspective projection collapses algebraically to a constant 2D
     multiplier s = P/(P − z), so screen_i = s_i·pan + k·world_i and the extra
     pre-scale offset is (s_i − 1)·pan/k. Going via CSS 3D would be the same
     result by a more fragile route — and would flatten silently the moment
     any layer used opacity<1, filter, clip-path, mask-image or contain:paint,
     two of which this scene uses.

     One correction to that formula as written: `pan` must be measured from the
     reference framing, or the layers are already sheared apart at the home
     view. Rebasing it onto the world point at the viewport centre also makes
     it stable under zoom, which the raw form is not:
         offset_i = (1 − s_i)·(c − c₀),   c = (viewCentre − pan)/k          */
  const cx = (camera.view.w * 0.5 - cam.x - drift.x) / k - WORLD.w / 2;
  const cy = (camera.view.h * 0.5 - cam.y - drift.y) / k - WORLD.h / 2;
  for (let i = 0; i < depthGroups.length; i++) {
    const g = depthGroups[i];
    if (g.s === 1) continue;                        // the reference plane never writes
    const f = 1 - g.s;
    const s = 'translate3d(' + (cx * f).toFixed(2) + 'px,' + (cy * f).toFixed(2) + 'px,0)';
    if (s !== g.last) { g.last = s; g.el.style.transform = s; }
  }
}

/* The rubber band is a purely visual signal, so it needs a text equivalent,
   and under reduced motion there is no band at all. §6.5, §6.6 */
let atZoomLimit = '';
function announceLimits() {
  const at = camera.zoomLimitState();
  if (at === atZoomLimit) return;
  atZoomLimit = at;
  el.live.textContent = at === 'max' ? 'Closest view. Nothing further to zoom into.'
                      : at === 'min' ? 'Widest view. The whole room is visible.' : '';
  el.btnIn.setAttribute('aria-disabled', at === 'max' ? 'true' : 'false');
  el.btnOut.setAttribute('aria-disabled', at === 'min' ? 'true' : 'false');
}

/* ══════════════════════════════════════════════════════════════════════
   §7  THE LOOP — one rAF, one pass.
   ══════════════════════════════════════════════════════════════════════ */
let lastTs = 0;
let fps = 60;

function frame(ts) {
  requestAnimationFrame(frame);

  const raw = lastTs ? ts - lastTs : 16.7;
  lastTs = ts;
  if (raw > 0) fps += ((1000 / raw) - fps) * 0.12;

  // Clamp dt against tab-switch and long-frame spikes, exactly as Motion's own
  // batcher does with maxElapsed = 40. §2.3
  const dt = Math.min(Math.max(raw, 1), 40) / 1000;

  stepTransition(ts);
  stepWind(ts);                                     // pure function of ts; costs nothing when idle
  if (sceneIsRoom) {
    camera.step(dt, ts);
    render(ts);
    announceLimits();
    maybeHandBackRaster(ts);
  }
  updateHud(ts);
}

/* ══════════════════════════════════════════════════════════════════════
   §8  INPUT
   ══════════════════════════════════════════════════════════════════════ */

const tracker = createVelocityTracker(100);
const classifyWheel = createWheelClassifier();

/* §2.8 — the wheel listener MUST be registered with addEventListener and
   { passive: false }. A passive listener's preventDefault() is a silent
   no-op, and the symptom is "the page scrolls behind my diorama". */
el.viewport.addEventListener('wheel', function (e) {
  if (e.cancelable !== false) e.preventDefault();   // mid-sequence events may be non-cancelable
  if (!sceneIsRoom) return;

  const now = performance.now();
  const n = normalizeWheel(e);
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;
  markMoving(now);

  if (e.ctrlKey || e.metaKey) {                     // trackpad pinch, or an explicit override
    camera.zoomBy(dzFromPinch(n.dy), px, py, now);
  } else if (classifyWheel(e, now) === 'wheel') {
    if (n.dx !== 0 && n.dy === 0) {
      camera.panBy(-n.dx, 0, now);                  // tilt-wheel: horizontal pan, was dead
    } else {
      camera.zoomBy(dzFromNotch(n.dy), px, py, now); // discrete detent: discard the magnitude
    }
  } else {
    camera.panBy(-n.dx, -n.dy, now);                // trackpad two-finger scroll: pan
  }
}, { passive: false });

/* Suppress Safari's own pinch-to-tab-overview. §2.7 — desktop Safari only,
   since iOS Safari has TouchEvent as well as GestureEvent. */
if (typeof window.GestureEvent !== 'undefined' && typeof window.TouchEvent === 'undefined') {
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
    el.viewport.addEventListener(type, function (e) { e.preventDefault(); });
  });
}

/* ── pointer: drag to pan, two fingers to pinch ───────────────────────── */
const pointers = new Map();
let pinch = null;                                   // { id1, id2, d0, z0 }
let lastPt = { x: 0, y: 0 };

const localPoint = (e) => ({ x: e.clientX - rect.left, y: e.clientY - rect.top });

el.viewport.addEventListener('pointerdown', function (e) {
  if (e.target.closest('[data-nodrag]')) return;    // hotspots are controls, not canvas
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  // Keeps the drag alive off-window. It throws NotFoundError if the pointer is
  // already gone by the time we get here, and an uncaught throw would abort the
  // rest of this handler — i.e. the drag would silently never start. Capture is
  // an enhancement, not a requirement, so losing it must not cost us the drag.
  try { el.viewport.setPointerCapture(e.pointerId); } catch (err) { /* drag on without it */ }
  pointers.set(e.pointerId, localPoint(e));
  const now = performance.now();
  markMoving(now);                                  // §3.3 — raster hint at GESTURE start

  if (pointers.size === 1) {
    camera.beginDrag(now);
    el.viewport.dataset.dragging = '1';
    lastPt = localPoint(e);
    tracker.reset();
    tracker.add(e.timeStamp, e.clientX, e.clientY);
    return;
  }
  if (pointers.size === 2) {
    const ids = Array.from(pointers.keys());
    const a = pointers.get(ids[0]), b = pointers.get(ids[1]);
    pinch = { id1: ids[0], id2: ids[1], d0: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), z0: cam.z };
    camera.beginPinch(now);
    el.viewport.dataset.dragging = '0';
    lastPt = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    tracker.reset();
  }
});

el.viewport.addEventListener('pointermove', function (e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, localPoint(e));
  const now = performance.now();

  if (pinch) {
    const a = pointers.get(pinch.id1), b = pointers.get(pinch.id2);
    if (!a || !b) return;
    const d = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y));
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    camera.zoomTo(pinch.z0 + Math.log(d / pinch.d0), mx, my, now);   // 1:1 with the fingers, log space
    camera.dragBy(mx - lastPt.x, my - lastPt.y, now);                // the midpoint also pans
    lastPt = { x: mx, y: my };
    return;
  }

  if (!el.viewport.dataset.dragging || el.viewport.dataset.dragging === '0') return;
  // getCoalescedEvents returns the un-merged samples the browser batched into
  // this move; roughly doubles the velocity samples on a 120 Hz trackpad. §2.9
  const pts = typeof e.getCoalescedEvents === 'function' ? e.getCoalescedEvents() : [e];
  for (let i = 0; i < pts.length; i++) tracker.add(pts[i].timeStamp, pts[i].clientX, pts[i].clientY);

  const p = localPoint(e);
  camera.dragBy(p.x - lastPt.x, p.y - lastPt.y, now);
  lastPt = p;
});

function endPointer(e, withVelocity) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  const now = performance.now();

  if (pinch && (e.pointerId === pinch.id1 || e.pointerId === pinch.id2)) {
    pinch = null;
    camera.endPinch(now);
    if (pointers.size === 1) {                      // one finger left: carry on as a drag
      lastPt = pointers.get(pointers.keys().next().value);
      camera.resumeDrag(now);
      el.viewport.dataset.dragging = '1';
      tracker.reset();
    }
    return;
  }

  if (el.viewport.dataset.dragging !== '1') return;
  el.viewport.dataset.dragging = '0';
  const v = withVelocity ? tracker.get() : { vx: 0, vy: 0 };
  camera.endDrag(v.vx, v.vy, now);
}

el.viewport.addEventListener('pointerup', function (e) { endPointer(e, true); });
el.viewport.addEventListener('pointercancel', function (e) { endPointer(e, false); });

/* ── keyboard and on-screen controls ──────────────────────────────────── */
/* Both route through the SAME springs as the gestures, so keyboard use does
   not feel like a different, worse product. §6.5 */
function nudge(dx, dy) {
  const now = performance.now();
  markMoving(now);
  camera.panBy(dx, dy, now);
}

function zoomStep(dz) {
  const now = performance.now();
  markMoving(now);
  // Keyboard and buttons zoom about the viewport centre — there is no cursor.
  camera.zoomBy(dz, camera.view.w * 0.5, camera.view.h * 0.5, now);
}

function goHome() {
  markMoving(performance.now());
  camera.home(0);
}

el.viewport.addEventListener('keydown', function (e) {
  if (e.metaKey || e.altKey || e.ctrlKey) return;
  const step = e.shiftKey ? 240 : 80;
  switch (e.key) {
    case 'ArrowLeft':  nudge(step, 0); break;
    case 'ArrowRight': nudge(-step, 0); break;
    case 'ArrowUp':    nudge(0, step); break;
    case 'ArrowDown':  nudge(0, -step); break;
    case '+': case '=': zoomStep(0.22); break;
    case '-': case '_': zoomStep(-0.22); break;
    case '0': goHome(); break;
    case 'Escape': leaveRoom(); break;
    default: return;
  }
  e.preventDefault();
});

window.addEventListener('keydown', function (e) {
  if (e.key !== 'd' && e.key !== 'D') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  el.hud.hidden = !el.hud.hidden;
});

el.ui.addEventListener('click', function (e) {
  const btn = e.target.closest('button[data-cmd]');
  if (!btn || btn.getAttribute('aria-disabled') === 'true') return;
  switch (btn.dataset.cmd) {
    case 'left':     nudge(120, 0); break;
    case 'right':    nudge(-120, 0); break;
    case 'up':       nudge(0, 120); break;
    case 'down':     nudge(0, -120); break;
    case 'zoom-in':  zoomStep(0.26); break;
    case 'zoom-out': zoomStep(-0.26); break;
    case 'home':     goHome(); break;
    case 'exit':     leaveRoom(); break;
  }
});

/* A visible, non-spatial list of the same destinations. §6.5 */
POIS.forEach(function (poi) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = poi.label;
  b.addEventListener('click', function () {
    SND.play('flip');
    markMoving(performance.now());
    camera.flyTo(poi);
    el.viewport.focus();
  });
  el.pois.appendChild(b);
});

window.addEventListener('resize', function () {
  measure();
  // k changed, so the leaf's closed pose did. Not while a transition is
  // running: the frame carries a scale() then, and getBoundingClientRect
  // reports the transformed box, which would poison k.
  // posedAngle is normally 0; ?door=<deg> pins it so a resize (which headless
  // Chrome fires after load) cannot silently reset the pose being screenshotted.
  if (!transition) { measureDoor(); setDoorAngle(posedAngle); }
});

/* ══════════════════════════════════════════════════════════════════════
   §9  DOOR ENTRY AND EXIT
       One time-based tween, stepped by the same rAF loop. No second loop.
   ══════════════════════════════════════════════════════════════════════ */
/* natural-motion.md §3.4. The knob turns first and the leaf does not move for
   160 ms: that beat is what says the mechanism responded before the mass did,
   and its absence is half of why the old door read synthetic. */
const T = {
  knob: 160,        // latch retracts. THE LEAF DOES NOT MOVE.
  swing: 1250,      // 0 -> DOOR_OPEN_DEG on doorEase — owner: 900 was too fast
  bloomIn: 700,     // the bloom starts rising here
  swap: 1600,       // scenes exchange at full white
  bloomOut: 800,
  exitIn: 620,
  exitOut: 700
};
const ENTRY_ZOOM = Math.log(1.16);   // the room resolves outward from 1.16x

let sceneIsRoom = false;
let transition = null;                              // { kind, t0 }

const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

/* ── the door swing ────────────────────────────────────────────────────
   natural-motion.md §3.3. A shove blended with a guided stop:
     f_cd  the step response of a critically damped 2nd-order system —
           starts from rest, accelerates briefly, decays for a long time
     f_mj  Flash & Hogan's minimum-jerk quintic — zero velocity AND zero
           acceleration at both ends
   The blend is monotone over 200,001 samples, so overshoot is structurally
   impossible. That is the point: a hinged door has no restoring torque and
   physically cannot bounce, so a spring is the wrong model for it however
   nice springs are everywhere else in this file.
   At 900 ms and 78 deg: peak 148.1 deg/s at 197 ms, terminal 5.12 deg/s. */
const DOOR_K = 6.0, DOOR_M = 0.35, DOOR_NORM = 0.98264873;   // 1 − 7·e⁻⁶
const doorEase = (u) =>
  (1 - DOOR_M) * ((1 - (1 + DOOR_K * u) * Math.exp(-DOOR_K * u)) / DOOR_NORM) +
  DOOR_M * (u * u * u * (10 - 15 * u + 6 * u * u));

/* ── the leaf's geometry, all measured in the entry plate's pixels ─────
   CLOSED POSE. The leaf's four corners in assets/website-entry-design.png,
   from sub-pixel line fits on the seams around it:
     left  (free) edge   x = 586.3, vertical           (both vertical edges are
     right (hinge) edge  x = 808.5, vertical            exactly vertical, which
     top    y = 0.11595·x + 178.45   sd 0.14 px         is what an axonometric
     bottom y = −0.09489·x + 974.05  sd 0.13 px         projection does)
   giving TL (586.3, 246.6) TR (808.5, 272.4) BR (808.5, 897.3) BL (586.3, 918.4).
   The two vertical edges are 671.8 and 625.0 px — a ratio of 1.075, so the art
   carries mild perspective and the leaf is a TRAPEZOID, not a parallelogram.
   The closed pose is therefore a projective map, so that at rest the leaf is
   pixel-for-pixel the painted door and cannot "jump" on the first frame.

   THE SWING. natural-motion.md §3.5: under a parallel projection the projected
   leaf at any angle is an exact affine image of the projected closed leaf, and
   the whole thing reduces to three scalars:
     g = uy/ux   u = the closed bottom edge, hinge -> free
     p = vx/ux   v = the ground direction perpendicular to the door wall,
     q = vy/ux       pointing the way the door opens, at the same WORLD length
   u is read straight off the fit above: (−222.2, +21.1), so g = −0.09496.

   v HAD TO BE MEASURED, and here is how. Direction: the base of the corridor's
   near-side wall, visible through the opening in assets/without-door.png,
   is a ground line perpendicular to the door wall. Fitted over x 658..750 by
   sub-pixel gradient peaks: slope +0.22447, sd 0.17 px. Cross-checked against
   the entry plate's own carpet, whose front-left edge is parallel to it:
   +0.21881 over 275 px. Length: for a parallel projection with yaw φ and
   elevation e, a horizontal axis at azimuth α projects with slope
   tan(φ)·sin(e) or cot(φ)·sin(e), so the two measured slopes give
     sin e = sqrt(0.09489 × 0.22447) = 0.14595   (e = 8.39°)
     tan φ = sqrt(0.09489 / 0.22447) = 0.65018   (φ = 33.03°)
   and the screen length per unit world length on the two axes is
     |X| = 0.84194, |Y| = 0.55896, ratio 0.66389.
   So |v| = 0.66389 × |u| = 148.2 px along (−0.97573, −0.21902), i.e.
   v = (−144.6, −32.5). Then p = 0.65068, q = 0.14604 — and note p comes out
   at tan φ and q at sin e, which is the check that the derivation closed.

   THE SIGN AND THE STOP. m11(ψ) = cos ψ + p·sin ψ goes through zero — the leaf
   edge-on — at ψ = 123.0°, so POSITIVE ψ is the safe direction and 78° leaves
   m11 = 0.844, comfortably clear. Swung the other way it would invert at −56.9°,
   less than three-quarters of the way through a 78° swing. This is why the old
   −96° looked wrong: it went edge-on and then MIRRORED, for 40% of the
   animation. Apparent width peaks at 119.3% at ψ = 33.0° before narrowing,
   which is the part nobody eyeballs correctly. */
const DOOR = {
  TL: [586.3, 246.6], TR: [808.5, 272.4], BR: [808.5, 897.3], BL: [586.3, 918.4],
  asset: { w: 580, h: 1297, inset: 2 },     // the cut-out's 2 px transparent margin
  /* THE OPEN ANGLE: 72 degrees, and "open it less" turns out to be backwards
     for this door. Because the camera sits 30.5 deg off the door's normal on
     the KNOB side, the leaf's own face covers the doorway until it has turned
     a long way: measured, the aperture is 0% uncovered below 43.69 deg, only
     4.7% at 50, 14.0% at 60 and 27.7% at 72. The previous 50 deg therefore
     revealed almost nothing, which is why it still read as a picture moving
     rather than a door opening. 72 deg is 80% of the ADA "fully open" datum
     and shows 53% of everything a 90-deg door could ever reveal.
     Edge-on is at 120.5 deg, so there is no ceiling worth respecting here. */
  /* OUTWARD (2026-09-06). The inward swing was geometrically right and
     perceptually unreadable: from this plate's camera (30.5 deg off the
     normal, knob side) the aperture is 0% uncovered below 43.69 deg, so half
     the animation was a leaf narrowing in place — the owner's "it's just
     shrinking", reported four times. Opened TOWARD the viewer there is no
     dead zone: the corridor reveals from the first degree and the leaf
     visibly sweeps out of the plane. +52 clears the doorway fully while
     stopping short of the window casing. */
  open: 52                                 // degrees; positive = outward (toward viewer)
};

/* ── THE LEAF'S CAMERA, SOLVED FROM THE PLATE ──────────────────────────
   research/door-swing.md §4.5. The previous two constructions were both
   provably wrong for this plate:

     - the parallel affine froze the free/hinge height ratio at exactly 1.0751
       at EVERY angle. That one frozen column is the "it just squishes" the
       owner reported: no camera behaves that way.
     - perspective(P) rotateY(psi) cannot represent this door at all. The
       correct swing is WIDER AND SHORTER between 0 and 43.7 deg (107.8% wide
       at 21.2 deg while the free edge is 94.1% tall), and a 149,959-sample
       scan found no (P, angle) pair that does both. Worse, the P it would
       need goes NEGATIVE past ~61 deg, which is a CSS syntax error.

   So the pose is one absolute matrix3d per frame, built from a 3x4 camera
   solved out of the artwork. The closed pose is not a separate factor any
   more — it IS this camera at psi = 0 — so there is no composition order left
   to get backwards, which is the bug that cost a round earlier.

   The plate is two-point: both stiles are exactly vertical, so no roll, no
   pitch. The leaf's own top and bottom edges meet at (3769.114, 616.162),
   fixing the horizon at 53.07% of frame. With the principal point at plate
   centre, that plus the corridor vanishing point gives f = 1467 px and places
   the camera 6.16 leaf-widths out, 30.50 deg off the door's normal on the KNOB
   side. That 30.50 deg is exactly why the leaf widens before it narrows, and
   why the corridor stays hidden until 43.69 deg. */
const DOORCAM = {
  vzx: -19.0,      // corridor-depth vanishing point x, on the horizon (the one soft number)
  ppx: 677.0,      // principal point x = 1354 / 2 (assumed; door-swing.md §8)
  ambient: 0.4443, // measured: shadowed / sunlit linear luma on the plate's own wood
  amb90: 0.2685    // measured: doorway reveal vs architrave face, i.e. a 90-deg plane
};

/** P = [c1 c2 c3 c4] acting on (u, v, w, 1) in leaf units:
      u along the wall, 0 at the hinge stile, 1 at the free stile
      v down,           0 at the head,        1 at the foot
      w into the corridor, in the SAME unit as u
    so the swing is simply (u, v, w) = (cos psi, v, sin psi). Solved once. */
function doorCameraBuild() {
  const src = [[0, 0], [1, 0], [1, 1], [0, 1]];
  const dst = [DOOR.TR, DOOR.TL, DOOR.BL, DOOR.BR];
  const A = [], B = [];
  for (let k = 0; k < 4; k++) {
    const x = src[k][0], y = src[k][1], X = dst[k][0], Y = dst[k][1];
    A.push([x, y, 1, 0, 0, 0, -X * x, -X * y]); B.push(X);
    A.push([0, 0, 0, x, y, 1, -Y * x, -Y * y]); B.push(Y);
  }
  for (let c = 0; c < 8; c++) {                       // Gaussian elimination
    let p = c;
    for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    const tA = A[c]; A[c] = A[p]; A[p] = tA;
    const tB = B[c]; B[c] = B[p]; B[p] = tB;
    for (let r = 0; r < 8; r++) {
      if (r === c) continue;
      const f = A[r][c] / A[c][c];
      for (let k = c; k < 8; k++) A[r][k] -= f * A[c][k];
      B[r] -= f * B[c];
    }
  }
  const s = B.map((v, k) => v / A[k][k]);
  const c1 = [s[0], s[3], s[6]], c2 = [s[1], s[4], s[7]], c4 = [s[2], s[5], 1];
  const Xx = c1[0] / c1[2], yh = c1[1] / c1[2];       // 3769.114, 616.162
  /* c3 is the corridor VP, scaled so one unit of w is one unit of u in the
     WORLD. f cancels: |K^-1 c1| = |K^-1 c3| reduces to the square root below.
     The sign is not free — homogeneous depth must GROW into the corridor, and
     c1[2] is negative because the wall comes toward the camera, so c3 takes
     |c1[2]|. Flip it and the leaf advances as it opens instead of receding. */
  const q = Math.abs(c1[2]) * Math.sqrt(Math.abs(Xx - DOORCAM.ppx) /
                                        Math.abs(DOORCAM.ppx - DOORCAM.vzx));
  return { c1: c1, c2: c2, c3: [q * DOORCAM.vzx, q * yh, q], c4: c4 };
}
const DCAM = doorCameraBuild();
const DAI = DOOR.asset.inset,
      DAW = DOOR.asset.w - 2 * DOOR.asset.inset,
      DAH = DOOR.asset.h - 2 * DOOR.asset.inset;

/** The leaf at psi degrees INTO the corridor, as one absolute matrix3d.
    No per-frame 8x8 solve: the plane homography at psi is exactly
    [c1 cos psi + c3 sin psi | c2 | c4], and the asset's box maps to (u, v) by
    a fixed affine, so a frame is two trig calls and ~20 multiplies.
    k = frameWidth / 1354: a projective map is not scale invariant, so the
    translation column is multiplied by k and the perspective row divided. */
function doorPoseMatrix(psiDeg, k) {
  const r = psiDeg * Math.PI / 180, cs = Math.cos(r), sn = Math.sin(r);
  const u0 = DCAM.c1[0] * cs + DCAM.c3[0] * sn,
        u1 = DCAM.c1[1] * cs + DCAM.c3[1] * sn,
        u2 = DCAM.c1[2] * cs + DCAM.c3[2] * sn;
  const e = (DOOR.asset.w - DAI) / DAW, m = DAI / DAH;
  const i  = u2 * e - DCAM.c2[2] * m + DCAM.c4[2];
  const a  = -u0 / DAW / i, d = -u1 / DAW / i, g = -u2 / DAW / i;
  const b  = DCAM.c2[0] / DAH / i, ee = DCAM.c2[1] / DAH / i, h = DCAM.c2[2] / DAH / i;
  const c  = (u0 * e - DCAM.c2[0] * m + DCAM.c4[0]) / i;
  const f  = (u1 * e - DCAM.c2[1] * m + DCAM.c4[1]) / i;
  return 'matrix3d(' + [a, d, 0, g / k, b, ee, 0, h / k, 0, 0, 1, 0, c * k, f * k, 0, 1]
    .map((v) => v.toFixed(9)).join(',') + ')';
}

const SHADOW_DIR = [-0.9822, 0.1875];   // plate-space, from the light solve
const SHADOW_LEN = 36;                  // plate px at full open, x sin psi
const SHADOW_PAD = 96;                  // baked canvas margin, asset px — see tools/bake-door-shadow.py
const DOOR_T = 0.05;                    // leaf thickness in leaf-width units (~4.4 cm of ~88)

/** The end-grain slab at the free stile, from the SAME camera. The stile's
    thickness line at rest is (u, w) = (1, s·t), s in [0,1]; rotated by psi it
    is (cos psi − s·t·sin psi, sin psi + s·t·cos psi), which is LINEAR in s —
    so the slab is one homography with columns
      A = t·(−sin psi · c1 + cos psi · c3)      (the s direction)
      B = c2                                    (v, straight down the stile)
      C = cos psi · c1 + sin psi · c3 + c4      (the front free-edge line)
    and a frame costs the same two trig calls as the leaf. Its s = 0 line IS
    the leaf's u = 1 edge, so the two surfaces share that edge exactly and
    painter's order (slab first) resolves visibility with no math. */
function doorEdgeMatrix(psiDeg, k) {
  const r = psiDeg * Math.PI / 180, cs = Math.cos(r), sn = Math.sin(r);
  const W = 32, H = 1293;
  const A = [], C = [];
  for (let j = 0; j < 3; j++) {
    A[j] = DOOR_T * (-sn * DCAM.c1[j] + cs * DCAM.c3[j]);
    C[j] = cs * DCAM.c1[j] + sn * DCAM.c3[j] + DCAM.c4[j];
  }
  const i = C[2];
  const a = A[0] / W / i, d = A[1] / W / i, g = A[2] / W / i;
  const b = DCAM.c2[0] / H / i, ee = DCAM.c2[1] / H / i, hh = DCAM.c2[2] / H / i;
  return 'matrix3d(' + [a, d, 0, g / k, b, ee, 0, hh / k, 0, 0, 1, 0,
                        C[0] / i * k, C[1] / i * k, 0, 1]
    .map((v) => v.toFixed(9)).join(',') + ')';
}

/** Face light at psi degrees, >= 0: a gamma-encoded Lambert.

    The light comes from image-RIGHT, the window/hinge side — an earlier
    comment in this file said upper LEFT and was backwards.

    Applied as the black .door-shade at opacity (1 - b), which composites to
    exactly img·b — the same arithmetic as the old brightness(b) filter, which
    is a plain sRGB multiply (verified: #bb581d at 0.7 rasterises to exactly
    131,62,20) — so the Lambert result is gamma-encoded before use. The SHAPE
    matters more than the endpoint: a cosine is nearly flat for the first few
    degrees (0.983 at 10 deg) and reads as a surface rotating out of the
    light, where a linear ramp reads as a dimmer being turned down. */
function doorFaceLight(psi) {
  const p = psi * Math.PI / 180;      // SIGNED: outward (negative) brightens
  return Math.pow(DOORCAM.amb90 + (DOORCAM.ambient - DOORCAM.amb90) * Math.cos(p) +
                  (1 - DOORCAM.ambient) *
                  Math.max(0, Math.cos(p + 0.2617994) / 0.9659258), 1 / 2.2);
}

/* k depends on the rendered frame width, so it is cached and never read inside
   the swing: a getBoundingClientRect() per frame is a forced layout. */
let doorK = 1;
let posedAngle = 0;                 // pinned by ?door=<deg>, see the bootstrap below
function measureDoor() {
  doorK = (el.doorFrame.getBoundingClientRect().width || 1354) / 1354;
}

/** Place the leaf at psiDeg. The file's external sign is kept: NEGATIVE is
    inward, away from the viewer, so ?door=-30 still means what it meant.
    psiDeg = 0 is exactly the painted door — doorPoseMatrix(0, 1) maps asset
    (2,2) -> (586.30, 246.60) and (578,1295) -> (808.50, 897.30), the measured
    corners — so there is no first-frame jump. */
function setDoorAngle(psiDeg) {
  const psi = -psiDeg, pa = Math.abs(psi);
  const pose = doorPoseMatrix(psi, doorK);
  el.doorLeaf.style.transform = pose;
  /* Every write below is transform or opacity — compositor work. The leaf
     carries no filter and the shade's/shadow's filters are static, so nothing
     re-rasterises during the swing (the old per-frame doorLeafFilter() cost
     ~233 ms of RasterTask across the 1.4 s swing at DPR 2). */
  el.doorShade.style.transform = pose;
  el.doorShade.style.opacity = Math.max(0, 1 - doorFaceLight(psi)).toFixed(4);
  /* The slab: hidden at rest (its projection folds exactly behind the leaf
     and a subpixel AA sliver could show), faded in over the first degrees. */
  el.doorEdge.style.transform = doorEdgeMatrix(psi, doorK);
  el.doorEdge.style.opacity = pa < 0.4 ? '0' : Math.min(1, pa / 4).toFixed(3);
  const s = Math.sin(pa * Math.PI / 180);
  /* Ramp the shadow in: the painting already contains the closed door's own
     shadow, so drawing one at psi = 0 would double it and break the
     bit-identical closed pose. Under 0.5 deg there is no shadow at all. */
  el.doorShadow.style.opacity = (psi <= 0 || s < 0.009) ? '0' : (0.36 * Math.min(1, pa / 8)).toFixed(3);
  /* The plate-space offset goes OUTSIDE the pose — that is exactly the
     displacement the old drop-shadow approximated by pushing the offset back
     through the pose's centre Jacobian (drop-shadow lengths live in the
     element's local space and get transformed). The inner translate aligns
     the baked canvas's padded origin with the leaf's. */
  const off = (-SHADOW_PAD * doorK).toFixed(2);
  el.doorShadow.style.transform =
    'translate(' + (SHADOW_DIR[0] * SHADOW_LEN * s * doorK).toFixed(2) + 'px, ' +
                   (SHADOW_DIR[1] * SHADOW_LEN * s * doorK).toFixed(2) + 'px) ' +
    pose + ' translate(' + off + 'px, ' + off + 'px)';
}

function setBloom(a, scale) {
  el.bloom.style.opacity = a.toFixed(3);
  el.bloom.style.transform = 'scale(' + scale.toFixed(3) + ')';
}

/* §3.3 again, for the transition's own movers. These three are the only
   elements that animate during the door sequence, and they animate for a
   known, bounded time, so the hint goes on when the sequence starts and off
   the frame it ends — never left declared in the stylesheet. */
function setTransitionRaster(on) {
  const v = on ? 'transform, opacity' : 'auto';
  el.bloom.style.willChange = v;
  el.doorLeaf.style.willChange = on ? 'transform' : 'auto';
  el.doorShadow.style.willChange = v;
  el.doorShade.style.willChange = v;
  el.doorEdge.style.willChange = v;
}

function showRoom(zOffsetLog) {
  sceneIsRoom = true;
  SND.ambience(true);
  el.doorScene.hidden = true;
  el.viewport.hidden = false;
  el.ui.hidden = false;
  el.hint.hidden = false;
  measure();                                        // sizes the camera and anchors it centrally
  camera.home(zOffsetLog);                          // ... and again, with the entry zoom
  lastStageTransform = '';
  render(performance.now());
  el.viewport.focus();
}

function showDoor() {
  sceneIsRoom = false;
  SND.ambience(false);
  el.viewport.hidden = true;
  el.ui.hidden = true;
  el.hint.hidden = true;
  el.doorScene.hidden = false;
  el.enterKnob.hidden = false;
  el.enterKnob.style.transform = '';
  el.knobTwist.hidden = false;
  el.knobTwist.style.transform = '';
  setDoorAngle(0);
  el.doorFrame.style.transform = 'none';
  el.enterKnob.focus();
}

function endTransition() {
  transition = null;
  setBloom(0, 1);
  setTransitionRaster(false);
}

/* ══════════════════════════════════════════════════════════════════════
   SOUNDS — Kenney RPG Audio (CC0, kenney.nl/assets/rpg-audio), one pack so
   the room sounds like one designed set (research/sounds.md, top-3 note).
   Every play() follows a user gesture, so autoplay policy never blocks.
   Files live in design-lab/sounds/; ledger in research/sound-credits.md.
   ══════════════════════════════════════════════════════════════════════ */
const SND = (function () {
  const files = {
    latch:     ['sounds/metalLatch.ogg', 0.5],
    doorOpen:  ['sounds/doorOpen_2.ogg', 0.45],
    doorClose: ['sounds/doorClose_1.ogg', 0.45],
    chair:     ['sounds/creak1.ogg', 0.55],
    squish:    ['sounds/cloth1.ogg', 0.35],
    lampSwitch: ['sounds/metalClick.ogg', 0.5],
    flip:      ['sounds/page-turn.m4a', 0.35]
  };
  /* EAGER, not lazy: cloneNode of a not-yet-loaded Audio plays silence, so
     lazy creation made the FIRST play of every sound mute (the owner's
     "chair is not creaking"). All five load at startup — ~60 KB total. */
  const cache = {};
  for (const k in files) { cache[k] = new Audio(files[k][0]); cache[k].preload = 'auto'; }
  /* the owner's Freesound room tone (CC0, kyles 637807), looped low under
     the room scene only */
  const tone = new Audio('sounds/room-tone.m4a');
  tone.preload = 'auto'; tone.loop = true; tone.volume = 0.14;
  function ambience(on) {
    if (on) tone.play().catch(function () {}); else tone.pause();
  }
  function play(name) {
    const f = files[name];
    let n = cache[name];
    if (!n.paused) n = n.cloneNode();      // clone only for overlapping plays
    n.volume = f[1];
    n.play().catch(function () {});        // a blocked play is not an error
  }
  return { play: play, ambience: ambience };
})();

function enterRoom() {
  if (transition || sceneIsRoom) return;
  if (reduceQuery.matches) { el.enterKnob.hidden = true; el.knobTwist.hidden = true; setBloom(0, 1); showRoom(0); return; }
  setTransitionRaster(true);
  SND.play('latch');
  transition = { kind: 'enter', t0: performance.now() };
}

function leaveRoom() {
  if (transition || !sceneIsRoom) return;
  if (reduceQuery.matches) { setBloom(0, 1); showDoor(); return; }
  setTransitionRaster(true);
  SND.play('doorClose');
  transition = { kind: 'exit', t0: performance.now() };
}

function stepTransition(now) {
  if (!transition) return;
  const t = now - transition.t0;

  if (transition.kind === 'enter') {
    if (t < T.swap) {
      /* The knob's 160 ms. There is no separable knob asset — the leaf carries
         its own painted knob — so the beat is spent on the glow, which
         brightens and settles while the leaf stays exactly where it was. */
      if (t < T.knob) {
        /* A PRESS, not a swell: the halo contracts onto the knob and springs
           back, like a latch being worked. The old +34% grow read as the glow
           inflating, which is backwards for an actuation.
           `transform` composes with the .door-knob rule's own translate/scale
           properties, so this is a pure extra scale on top of the pulse. */
        el.enterKnob.style.transform = 'scale(' + (1 - 0.30 * Math.sin(t / T.knob * Math.PI)).toFixed(3) + ')';
        /* the disc IS the painted knob's pixels, so at 0 deg it is invisible;
           sweeping to -40 deg and back moves the painted highlight = a twist */
        el.knobTwist.style.transform = 'rotate(' + (-40 * Math.sin(t / T.knob * Math.PI)).toFixed(2) + 'deg)';
      } else if (!el.enterKnob.hidden) {
        el.enterKnob.hidden = true;                 // the latch has cleared
        el.knobTwist.hidden = true;                 // the hand lets go with it
        SND.play('doorOpen');                       // and the hinge speaks once
      }
      setDoorAngle(DOOR.open * doorEase(clamp((t - T.knob) / T.swing, 0, 1)));
      const e = easeInOut(clamp((t - T.bloomIn) / (T.swap - T.bloomIn), 0, 1));
      setBloom(e, 0.35 + 2.55 * e);
      /* The FRAME does not move. It used to scale up 5% with the bloom, and
         that is what made the whole doorway read as "opening up" with the
         leaf (owner, 2026-09-04): to a person standing at a door, the frame
         is architecture. The push-in feel is carried by the bloom plus the
         room resolving outward from ENTRY_ZOOM after the swap. */
      return;
    }
    if (!sceneIsRoom) showRoom(ENTRY_ZOOM);
    const out = clamp((t - T.swap) / T.bloomOut, 0, 1);
    setBloom(1 - easeOutCubic(out), 2.9 + 0.6 * out);
    if (out >= 1) endTransition();
    return;
  }

  if (t < T.exitIn) {
    const e = easeInOut(t / T.exitIn);
    setBloom(e, 0.4 + 2.5 * e);
    return;
  }
  if (sceneIsRoom) showDoor();
