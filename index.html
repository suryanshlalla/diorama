  const out = clamp((t - T.exitIn) / T.exitOut, 0, 1);
  setBloom(1 - easeOutCubic(out), 2.9 + 0.5 * out);
  if (out >= 1) endTransition();
}

el.enterKnob.addEventListener('click', enterRoom);
el.exitKnob.addEventListener('click', leaveRoom);

/* ══════════════════════════════════════════════════════════════════════
   §10 DEBUG READOUT — D toggles it. Throttled, because the HUD must not
       cost a style recalc on every frame.
   ══════════════════════════════════════════════════════════════════════ */
let hudDue = 0;

const BUILD = 'b12 · 2026-09-11';
document.title += '  [' + BUILD + ']';
console.info('diorama build', BUILD);
function updateHud(now) {
  if (el.hud.hidden || now < hudDue) return;
  hudDue = now + 110;
  // The camera does not run on the door scene, so do not print stale numbers.
  const live = sceneIsRoom;
  el.hud.textContent =
    'scale    ' + (live ? Math.exp(cam.z).toFixed(4) + '  (z ' + cam.z.toFixed(4) + ')' : '—') + '\n' +
    'x        ' + (live ? cam.x.toFixed(1) : '—') + '\n' +
    'y        ' + (live ? cam.y.toFixed(1) : '—') + '\n' +
    'fps      ' + fps.toFixed(1) + '\n' +
    'will-chg ' + (rasterOn ? 'ON' : 'off') + '\n' +
    'state    ' + (live ? camera.mode(now) : 'door') + '\n' +
    'anchor   ' + camera.anchor.x.toFixed(0) + ', ' + camera.anchor.y.toFixed(0) + '\n' +
    'sway     ' + (windT0 === null ? 'off' : windSwayDeg((now - windT0) / 1000).toFixed(3) + ' deg') + '\n' +
    'z limits ' + camera.limits.zMin.toFixed(3) + ' .. ' + camera.limits.zMax.toFixed(3) + '\n' +
    'build    ' + BUILD;
}

/* ══════════════════════════════════════════════════════════════════════
   §11 BOOT
   ══════════════════════════════════════════════════════════════════════ */
function syncMotionPreference() {
  camera.setReducedMotion(reduceQuery.matches);
}
reduceQuery.addEventListener('change', syncMotionPreference);

syncMotionPreference();
measure();
measureDoor();
setDoorAngle(0);
if (window.location.hash === '#room') showRoom(0);
/* Still-frame hooks for headless verification (rAF barely advances there):
   ?door=<deg> poses the leaf; ?wind=<seconds> freezes the sway at that time. */
(function () {
  const q = new URLSearchParams(window.location.search);
  if (q.has('door')) {
    const d = parseFloat(q.get('door')) || 0;
    /* Synchronously, NOT inside requestAnimationFrame: headless Chrome under
       --virtual-time-budget barely runs rAF, so a pose set there never reaches
       the screenshot even though it does reach the DOM. Reading a layout
       property first forces the layout measureDoor() needs. */
    void el.doorFrame.getBoundingClientRect().width;
    posedAngle = d;
    measureDoor();
    el.enterKnob.hidden = el.knobTwist.hidden = d !== 0;
    setDoorAngle(d);
  }
  if (q.has('wind')) windFreezeT = parseFloat(q.get('wind')) || 0;   // stepWind honours this
})();

/* The module boundary, and the surface the verification harness drives.
   createCamera is DOM-free, so a harness can spin up its own instances and
   step them at any dt without touching this page's scene at all. */
/* ══════════════════════════════════════════════════════════════════════
   SELF-AUDIT. Runs once on load and complains in the console.

   This exists because placement and proportion errors were repeatedly being
   found by eye — a doubled iPod, a laptop covering 85% of the books — after
   they had already shipped. Eyeballing a diorama is exactly the kind of check
   a human is bad at and arithmetic is good at, so the file now checks itself.

   Two tests:
     SIZE   every prop's declared cm against the real object's dimensions.
     OVERLAP  every pair's RENDERED rectangles. The earlier check compared only
            u-extents within a row, which is why the laptop hiding the books
            passed it: a tall front object occludes a shorter back object at
            the same u no matter what v says, because the desk's whole depth is
            only ~58 screen px while the objects are 20-80 px tall.
   ══════════════════════════════════════════════════════════════════════ */
const REAL_CM = {                        // {min, max} for the actual object
  clock: [10, 12], lamp: [35, 40], books: [16, 26], photos: [12, 18], jelly: [6, 12],
  folder: [29, 32], ipod: [10, 15], notebook: [19, 22], laptop: [32, 40],
  letter: [18, 26], mug: [10, 13], note: [7, 9], chair: [95, 125]
};
const OVERLAP_LIMIT = 0.25;              // >25% of the smaller reads as hiding

/* Objects that LIE on the wood. The desk is only ~58 screen px deep while the
   props are 20-80 px tall, so a flat object placed too far back necessarily
   pokes out past the desk's far edge and reads as floating in the window —
   which is exactly what the books were doing at v = 0.80 (their own height is
   39 px, so their ceiling was v = 0.32). Things that genuinely stand up — the
   laptop, the lamp, the clock, the mug — are allowed to rise above it. */
const FLAT_ON_DESK = ['books', 'folder', 'letter', 'photos', 'notebook', 'ipod'];

function auditScene() {
  const bad = [];
  PROPS.forEach(function (p) {
    const r = REAL_CM[p.id];
    if (r && (p.cm < r[0] || p.cm > r[1])) {
      bad.push('SIZE  ' + p.id + ' declared ' + p.cm + 'cm, real is ' + r[0] + '-' + r[1] + 'cm');
    }
  });
  const laid = PROPS.filter((p) => p.on === 'desk').map(layoutProp);
  for (let i = 0; i < laid.length; i++) {
    for (let j = i + 1; j < laid.length; j++) {
      const a = laid[i], b = laid[j];
      const ox = Math.max(0, Math.min(a.left + a.width, b.left + b.width) - Math.max(a.left, b.left));
      const oy = Math.max(0, Math.min(a.top + a.height, b.top + b.height) - Math.max(a.top, b.top));
      const frac = (ox * oy) / Math.min(a.width * a.height, b.width * b.height);
      if (frac > OVERLAP_LIMIT) {
        bad.push('OVERLAP  ' + a.prop.id + ' x ' + b.prop.id + '  ' + Math.round(frac * 100) + '% of the smaller');
      }
    }
  }
  const deskDepthPx = Math.abs(DESK.faceDepth[1]) * SRC_TO_STAGE;
  laid.forEach(function (l) {
    if (FLAT_ON_DESK.indexOf(l.prop.id) === -1) return;
    const room = deskDepthPx * (1 - l.prop.at[1]);
    if (l.height > room + 0.5) {
      bad.push('FLOATS  ' + l.prop.id + ' is ' + Math.round(l.height) + 'px tall but only ' +
               Math.round(room) + 'px of desk remains behind it — it crosses the far edge');
    }
  });
  if (bad.length) console.warn('[diorama audit]\n  ' + bad.join('\n  '));
  return bad;
}

/* the night veil sits above every depth group; fireflies live in each tree
   pane, above the branches, under the glaze */
(function buildNight() {
  const veil = document.createElement('div');
  veil.className = 'night-veil';
  el.stage.appendChild(veil);
  /* on the SLOT, after the glaze: firefly light sits on the glass, not
     drowned behind it (they were 55% dimmed at night — invisible) */
  const panes = document.querySelectorAll('#windows .depth');
  panes.forEach(function (paneDepth) {
    const pane = paneDepth.parentElement;
    for (let i = 0; i < 8; i++) {
      const f = document.createElement('div');
      f.className = 'firefly';
      /* inside the aperture: TREE_BOX is the tree canvas in world px, and the
         pane clip covers its middle — the old full-stage percentages put most
         fireflies outside the clip, i.e. invisible (owner: "not there") */
      f.style.left = (100 * (TREE_BOX.left + (0.22 + Math.random() * 0.56) * TREE_BOX.side) / WORLD.w) + '%';
      f.style.top = (100 * (TREE_BOX.top + (0.16 + Math.random() * 0.42) * TREE_BOX.side) / WORLD.h) + '%';
      f.style.setProperty('--ff-dur', (9 + Math.random() * 7).toFixed(1) + 's');
      f.style.setProperty('--ff-x1', (Math.random() * 60 - 30).toFixed(0) + 'px');
      f.style.setProperty('--ff-y1', (-Math.random() * 50).toFixed(0) + 'px');
      f.style.setProperty('--ff-x2', (Math.random() * 60 - 30).toFixed(0) + 'px');
      f.style.setProperty('--ff-y2', (-Math.random() * 40).toFixed(0) + 'px');
      f.style.setProperty('--ff-x3', (Math.random() * 40 - 20).toFixed(0) + 'px');
      f.style.setProperty('--ff-y3', (-Math.random() * 60).toFixed(0) + 'px');
      f.style.animationDelay = (-Math.random() * 9).toFixed(1) + 's, ' + (-Math.random() * 3).toFixed(1) + 's';
      pane.appendChild(f);
    }
  });
})();

/* The live layer over the desk painting: IST clock hands on the painted
   clock, and the lamp as the night switch. Percent positions are of the desk
   plate's own box; refined against a rendered still. */
(function mountDeskLive() {
  if (!deskBox) return;
  const mk = function (cls) {
    const d2 = document.createElement('div');
    d2.className = cls;
    deskBox.appendChild(d2);
    return d2;
  };
  const hh = mk('clock-hand clock-hand--h'), mh = mk('clock-hand clock-hand--m');
  mk('clock-hand clock-cap');
  const setIST = function () {
    const now = new Date();
    const ist = new Date(now.getTime() + (now.getTimezoneOffset() + 330) * 60000);
    const mm = ist.getMinutes() + ist.getSeconds() / 60;
    const h2 = (ist.getHours() % 12) + mm / 60;
    hh.style.transform = 'rotate(' + (h2 * 30).toFixed(1) + 'deg)';
    mh.style.transform = 'rotate(' + (mm * 6).toFixed(1) + 'deg)';
  };
  setIST(); setInterval(setIST, 20000);

  const zone = document.createElement('button');
  zone.type = 'button';
  zone.className = 'lamp-zone';
  zone.setAttribute('aria-label', 'Pull the lamp chain: toggle night');
  zone.setAttribute('data-nodrag', '');
  /* soft contact shadows under the three visible feet — grounds the
     extended legs on the carpet */
  [[6.4, 61.6], [77.0, 98.9], [94.7, 92.7]].forEach(function (pt) {
    const sh = document.createElement('div');
    sh.className = 'leg-shadow';
    sh.style.left = pt[0] + '%';
    sh.style.top = pt[1] + '%';
    deskBox.appendChild(sh);
  });
  for (let w = 0; w < 2; w++) {
    const wisp = document.createElement('div');
    wisp.className = 'mug-steam';
    wisp.style.left = (83.1 + w * 1.5) + '%';
    wisp.style.animationDelay = (w * 1.7) + 's';
    deskBox.appendChild(wisp);
  }
  for (const cls of ['lamp-pool']) {
    const g2 = document.createElement('div');
    g2.className = cls;
    deskBox.appendChild(g2);
  }
  const chain = document.createElement('img');
  chain.src = 'assets/derived/lamp-chain.png';
  chain.className = 'lamp-string';
  chain.alt = ''; chain.draggable = false;
  deskBox.appendChild(chain);
  zone.addEventListener('click', function () {
    SND.play('lampSwitch');
    el.stage.classList.toggle('night');
    chain.classList.remove('lamp-string--pull');
    void chain.offsetWidth;                       // restart the animation
    chain.classList.add('lamp-string--pull');
  });
  deskBox.appendChild(zone);
})();

auditScene();   // shout in the console if a prop is mis-sized or hidden

window.Diorama = Object.freeze({
  audit: auditScene,
  math: DioramaMath, createCamera: createCamera, camera: camera,
  /* test hooks: pose the door at an angle, and freeze the wind at a time, so
     stills of the swing and the sway can be rendered headlessly */
  // inward is NEGATIVE, so hide the halo whenever the door is posed off zero
  poseDoor: function (deg) { el.enterKnob.hidden = el.knobTwist.hidden = deg !== 0; setDoorAngle(deg); },
  poseWind: function (t) {
    for (const L of treeLayers) L.el.style.transform = treeLayerTransform(L, t);
    for (const b of boughs) {
      segmentAnglesDeg(t, b.branch, b.angles);
      for (let i = 0; i < b.branch.N; i++) b.segs[i].style.transform = 'rotate(' + b.angles[i].toFixed(4) + 'deg)';
    }
  },
  segmentAnglesDeg: segmentAnglesDeg, swayUnit: swayUnit
});

requestAnimationFrame(frame);
</script>
</body>
</html>
